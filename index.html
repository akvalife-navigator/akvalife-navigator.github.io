function renderLocalObjections(root){
  const list=AKVALIFE_NEW_SECTIONS.objections;
  const groups=['Цена и скидки','Недоверие и сомнения','Клиент откладывает покупку'];
  root.innerHTML=`<div class="objection-layout">
    <div class="panel"><div class="panel-title">Разделы</div><div class="category-list" id="akvaCategories">${groups.map((g,i)=>`<button type="button" class="category-btn ${i===0?'active':''}" data-local-cat="${i}">${escapeHtml(g)}</button>`).join('')}</div></div>
    <div class="panel"><div class="panel-title">Возражения клиентов</div><div id="akvaObjections" class="objection-list"></div><div id="akvaAnswer"></div></div>
  </div>`;
  const cats=root.querySelector('#akvaCategories'),ob=root.querySelector('#akvaObjections'),detail=root.querySelector('#akvaAnswer');
  function choose(index){
    const group=groups[index];
    cats.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.localCat)===index));
    const matching=list.map((x,i)=>({x,i})).filter(a=>a.x.category===group);
    ob.innerHTML=matching.map((a,j)=>`<button type="button" class="objection-btn ${j===0?'active':''}" data-akva-index="${a.i}">${escapeHtml(a.x.objection)}</button>`).join('');
    ob.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.akvaIndex))));
    if(matching.length)show(matching[0].i); else detail.innerHTML='<p>В этой категории пока нет возражений.</p>';
  }
  function show(i){
    const item=list[i];
    ob.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.akvaIndex)===i));
    detail.innerHTML=`<div class="panel" style="margin-top:16px"><div class="panel-label">Возражение клиента</div><div class="panel-title" style="font-size:20px;margin-top:7px">${escapeHtml(item.objection)}</div>${item.answers.map((a,j)=>`<div class="answer-card"><div class="answer-text" style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(a)}</div><div class="answer-actions"><button type="button" class="secondary-button" data-akva-copy="${j}">Копировать</button></div></div>`).join('')}</div>`;
    detail.querySelectorAll('[data-akva-copy]').forEach(b=>b.addEventListener('click',()=>copyText(item.answers[Number(b.dataset.akvaCopy)])));
  }
  cats.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.localCat))));
  choose(0);
}
function selectObjectionCategory(category){
  selectedCategory=category;selectedObjection=null;
  document.querySelectorAll(".category-btn").forEach(b=>b.classList.toggle("active",b.dataset.category===category));
  const items=objectionLibrary.items.filter(x=>x.category===category);
  const list=document.getElementById("objectionList");
  list.innerHTML=items.map((x,i)=>`<button class="objection-btn" data-index="${objectionLibrary.items.indexOf(x)}">${escapeHtml(x.objection)}</button>`).join("");
  list.querySelectorAll(".objection-btn").forEach(btn=>btn.addEventListener("click",()=>selectObjection(Number(btn.dataset.index),btn)));
  document.getElementById("objectionDetail").innerHTML="";
}
function selectObjection(index,button){
  selectedObjection=objectionLibrary.items[index];
  document.querySelectorAll(".objection-btn").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  const item=selectedObjection;
  const detail=document.getElementById("objectionDetail");
  detail.innerHTML=`
    <div class="panel" style="margin-top:16px">
      <div class="panel-label">Возражение клиента</div>
      <div class="panel-title" style="font-size:20px;margin-top:7px">${escapeHtml(item.objection)}</div>
      ${item.answers.map((a,i)=>`
        <div class="answer-card">
          <div class="answer-text">${escapeHtml(a.text)}</div>
          <div class="answer-meta">Источник: ${escapeHtml(item.source.author)}, «${escapeHtml(item.source.book)}», стр. ${escapeHtml(a.source_page)}</div>
          <div class="answer-actions"><button class="secondary-button" data-copy="${i}">Скопировать ответ ${i+1}</button></div>
        </div>`).join("")}
      ${item.recommendation?`<div class="note"><strong>Рекомендация:</strong> ${escapeHtml(item.recommendation)}</div>`:""}
    </div>`;
  detail.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",()=>copyText(item.answers[Number(btn.dataset.copy)].text)));
}
function renderClient(box){
  const data=AKVALIFE_NEW_SECTIONS;
  box.innerHTML=moduleHeader('Работа с клиентом','Касания · Шаблоны сообщений · Наводящие вопросы · СОПРАНО')+`
    <div class="mode-switch" role="group" aria-label="Разделы работы с клиентом">
      <button type="button" class="active" data-client-mode="questions">Вопросы при разговоре</button>
      <button type="button" data-client-mode="messages">Сообщения/касания в мессенджеры</button>
      <button type="button" data-client-mode="correspondence">Продажи в переписках</button>
    </div><div id="clientContent"></div>`;
  const out=box.querySelector('#clientContent');
  function card(label,text,index,kind){return `<div class="panel" style="margin:0"><div class="client-step">${escapeHtml(label)}</div><div class="client-entry">${escapeHtml(text)}</div><div class="answer-actions"><button type="button" class="secondary-button" data-client-kind="${kind}" data-client-index="${index}">Копировать</button></div></div>`;}
  function draw(mode){
    box.querySelectorAll('[data-client-mode]').forEach(b=>b.classList.toggle('active',b.dataset.clientMode===mode));
    if(mode==='questions'){
      out.innerHTML=`<h3 class="client-group-title">Вопросы при разговоре</h3><div class="client-cards">${data.questions.map((q,i)=>card('Вопрос '+(i+1),q,i,'questions')).join('')}</div>
      <h3 class="client-group-title">СОПРАНО</h3><div class="client-cards">${data.soprano.map((q,i)=>card('СОПРАНО · '+(i+1),q,i,'soprano')).join('')}</div>
      ${data.portrait?`<details class="panel"><summary style="cursor:pointer;font-weight:700">Портрет клиента из таблицы</summary><div class="client-entry" style="margin-top:12px">${escapeHtml(data.portrait)}</div></details>`:''}`;
    }else if(mode==='correspondence'){
      const entries=AKVALIFE_CORRESPONDENCE;
      const stages=['Касание 1','Касание 2','Касание 3'];
      out.innerHTML=`<div class="panel" style="margin:0 0 16px"><div class="panel-title">Продажи в переписках</div><p class="akva-empty-note">Готовые касания из таблицы. Варианты сообщений можно копировать отдельно.</p></div>
        ${stages.map((stage)=>`<section class="correspondence-group"><h3 class="client-group-title">${escapeHtml(stage)}</h3><div class="client-cards">${entries.map((entry,i)=>entry.stage===stage?card(entry.variant,entry.text,i,'correspondence'):'').join('')}</div></section>`).join('')}`;
    }else{
      const msgs=data.messages.filter(x=>x.trim().toLowerCase()!=='или');
      // Seven messages: stages 1–5 and two alternatives for stage 6.
      out.innerHTML=`<div class="panel" style="margin:0 0 15px"><div class="panel-title">Сообщения/касания в мессенджеры</div><p class="akva-empty-note">Последовательные касания из таблицы. Сообщения можно копировать и отправлять в WhatsApp, MAX и Telegram.</p></div>
        <div class="client-cards">${msgs.map((msg,i)=>card(i===6?'Касание 6 · Вариант 2':`Касание ${Math.min(i+1,6)}${i===5?' · Вариант 1':''}`,msg,i,'messages')).join('')}</div>`;
    }
    out.querySelectorAll('[data-client-kind]').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.clientKind,i=Number(b.dataset.clientIndex);
      copyText(k==='correspondence'?AKVALIFE_CORRESPONDENCE[i].text:(k==='messages'?data.messages.filter(x=>x.trim().toLowerCase()!=='или')[i]:data[k][i]));
    }));
  }
  box.querySelectorAll('[data-client-mode]').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.clientMode)));
  draw('questions');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#096;");}

function setDailyQuote(){
  const epoch=new Date(2026,0,1);
  const today=new Date();
  const start=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const diff=Math.floor((start-epoch)/86400000);
  const index=((diff%360)+360)%360;
  const order=[];
  for(let i=0;i<360;i++){
    let x=(i*37+13)%quotes.length;
    if(i>0 && x===order[i-1]) x=(x+1)%quotes.length;
    order.push(x);
  }
  document.getElementById("dailyQuote").textContent=quotes[order[index]];
}

,"Замечали, что после обычной воды иногда ощущается тяжесть в желудке?","Как вам идея иметь дома воду, которая по составу приближена к горным источникам?","Если бы можно было получать чистую, структурированную и полезную воду без регулярной покупки фильтров, это было бы удобно?","Как думаете, ваши дети или близкие почувствовали бы разницу, если бы пили такую воду каждый день?","Давайте вас запишу/ забронируем/оформим заказ?"],"soprano":["С: вы желаете для себя приобрести или для родственников? Сколько обычно воды вы пьете?","О: вы использовали ранее какой либо альтернативный подход к восстановлению своего здоровья?","П: Подскажите что вы желаете получить приобретя наш прибор?","Р: Достаточно ли вам информации для принятия решения? Я могу вам предоставить доступы к источникам где можно посмотреть видео и познакомиться наглядно, что думаете, у вас есть whatsApp?","А: Как вы наверно заметили, мы не единственные на рынке, где вы о нас узнали?","Н: подскажите беспокоит ли вас АД, так как при таком заболевании важно знать с чего начать? Из какого источника вы берете воду, мы бы могли подсказать как использовать и получать максимальные результаты?","О: Мы можем сохранить для вас условия на 5 дней, или оформить сейчас, вы готовы?","Ситуация: для чего?","Опыт: Пробовали ранее?","Принципы: Что для вас важно?","Решения: нужна ли доп инфо или посоветоваться?","Аналоги: рассматриваете еще варианты?","Нежелательно: рассказать то что не пишут.","Ограничение: по срокам, по бюджету"],"messages":["1 - сообщение  Рассылка с акцией или информацией ","2 - через пару дней после первого. \n Здравствуйте, имя клиента, ранее вы интересовались нашей продукцией.  Подскажите, пожалуйста, ознакомились с отправленной информацией? Может появились вопросы? Или готовы оформить заказ? ","3 - Если клиент молчит\nДобрый день! Не дождались от вас ответа!  Имя клиента, решили поделиться с вами интересными способами применения  ионизированной воды для питья и в быту.\nНадеемся это поможет вам принять решение.\n\n- Как защититься от ОРВИ, гриппа и всех сезонных простуд https://t.me/aquatherapykpk/2111\n\n- Где брать энергию на каждый день? https://t.me/tatcii/1219\n\n- Вымачивание орехов, круп, овощей и других продуктов перед употреблением https://t.me/akvalifewater/885\n\n❓Что скажете? Было интересно узнать о новых способах применения ионизированной воды?","4- сообщение \nИмя клиента,  приветствуем вас! Как ваши дела? Предлагаем познакомиться. Это поможем нам с вами понять куда двигаться дальше и предложить оптимальное решение под ваш запрос. \n\nРасскажите, что для вас важнее в воде - вкус, польза для здоровья или удобство? Какую воду пьете сейчас чаще: фильтрованную бутилированную или из под крана? Вы задумывались что вода влияет на ваше самочувствие и уровень энергии?","5. Имя клиента, хорошего дня! Надеемся вы успели ознакомиться с информацией, которую мы направляли. А вы задумывались как правильно выбрать ионизатор воды? На что обратить внимание, чтобы прибор служил долго, а качество радовало и приносило пользу?\nМы для вас подготовили ТОП-3 ВАЖНЫХ момента, на которые нужно обращать внимание при покупке.\n1. Мембрана (фильтр) - расходный материал. Поэтому для экономии семейного бюджета важно выбирать мембраны из нетканого материала и покрытую специальным высокотехнологичным полимером. Такая мембрана служит 2 года и простая в эксплуатации. \n2. Материал электродов - именно они напрямую взаимодействуют с водой и отвечают за электролиз. При некачественном материале электрод может разрушаться и придется пить химический бульон 😱\nВ наших ионизаторах Катод (светлый электрод) - изготовлен из медицинской стали.\nАнод (темный электрод) - изготовлен из титана, который добывают на Салдинском месторождении. Покрыт по системе ОИРТА оксидами сплавов драгоценных металлов иридием и рутением.\nОба электрода (анод и катод) при правильной эксплуатации в замене не нуждаются! \n3. Программное обеспечение, герметичный корпус и анализатор воды.\n\n💧 Бонус. Обращайте внимание на Гарантийный период, доступность сервисного центра и поддержку производителя на всех этапах эксплуатации. \n\n❓ На сколько информация оказалась полезной от 1 до 5ти?","6. Здравствуйте, имя клиента. Мы решили напомнить, что приобретая продукцию у нас вы получаете:\n- Бесплатную доставку \n- Тестовый преиод 90 дней. \n- Долгослужащие комплектцющие\n- Ежедневную поддержу call-центра по вопросам эксплуатации \nДавайте сегодня созвонимся, что бы обсудить детали. Вас лучше набрать сейчас или вечером? ","Или ","6. Здравствуйте, имя клиента. Мы решили напомнить, что приобретая продукцию у нас вы получаете:\n- Чистую воду. Больше можно не тратить деньги на фильтры или покупку воды.\n-Полезную воду, которая соответствует нашей внутренней среде организма и улучшает биоритмы\n-Кислотную воду- антисепктик. А значит, домашний хлоргексидин всегда под рукой. \n-РН капли (входят в комплектацию). Можно будет самостоятельно проверить рН любой жидкости, включая мочу и слюну. \nПоэтому давайте сейчас созвонимся, что бы обсудить детали и составить предварительную заявку.?"],"portrait":"Портрет клиента:\nЭто люди среднего возраста от 30 лет, которые заботятся о своем здоровье и здоровье своей семьи. Как правило, это люди работающие или пенсионеры, семейные, стремящиеся обеспечить себя и своих близких качественной, полезной питьевой водой. А некоторые ищут альтернативный способ восстановления здоровья. Они внимательны к своему питанию, занимаются спортом, стараются вести здоровый образ жизни, стремятся к долголетию. Обращают внимание на отзывы и репутацию производителя."};

const AKVALIFE_FAQ_109=[{"cell":"NEW-HUMIDIFIER-FILTER-NOV26","question":"Сколько фильтров в комплекте увлажнителя AkvaLife и как за ними ухаживать?","answer":"В комплекте 3 шт, 1 установлен. Раз в полгода ставим новый, а пыльный стираем ручками мыльной водой и просушиваем, он многоразовый.","category":"Товары здоровья"},{"cell":"NEW-FAQ-NOV26-1","question":"Для чего нужна функция «Детский доктор» в НЕЙРОДЭНС-ПКМ?","answer":"Функция «Детский доктор» предназначена для проведения процедур у детей с учётом возраста. При её включении аппарат автоматически ограничивает мощность воздействия до 5 условных единиц, сокращает время процедуры и предлагает программы с учётом возрастной группы. Для детей младше 1 года предусмотрены программы «Вздутие», «Диарея», «Запор», «Насморк» и «Удушье». Применять аппарат следует по инструкции с учётом противопоказаний. Источник: пособие по применению НЕЙРОДЭНС-ПКМ, раздел 2.1.5.","category":"Тронитек"},{"cell":"NEW-FAQ-NOV26-2","question":"Для чего нужен режим «Скрининг» в НЕЙРОДЭНС-ПКМ?","answer":"Режим «Скрининг» предназначен для поиска триггерных (проблемных) зон на коже и выбора участков последующего воздействия. Аппарат сравнивает электрические характеристики симметричных участков кожи. Это режим условной диагностики, он не заменяет обследование и постановку диагноза врачом. Источник: пособие по применению НЕЙРОДЭНС-ПКМ, раздел 2.1.4.","category":"Тронитек"},{"cell":"NEW-FAQ-NOV26-3","question":"Какая мембрана установлена в генераторе водородной воды Премиум (ГВВП)?","answer":"В генераторе водородной воды AkvaLife Premium используется ионообменная мембрана DuPont N117 с платиновым покрытием.","category":"ГВВ "},{"cell":"NEW-FAQ-NOV26-4","question":"Какая мембрана установлена в генераторе водородной воды Лайт (ГВВЛ)?","answer":"В генераторе водородной воды AkvaLife Lite используется ионообменная мембрана DuPont N117 с платиновым покрытием.","category":"ГВВ "},{"cell":"NEW-FAQ-NOV26-5","question":"Где производится генератор водородной воды Премиум (ГВВП)?","answer":"Генератор водородной воды AkvaLife Premium производится в Китае, в городе Шэньчжэнь. Производитель — SHENZHEN CYPLER WATER TREATMENT EQUIPMENT CO., LTD.","category":"ГВВ "},{"cell":"NEW-FAQ-NOV26-6","question":"Где производится генератор водородной воды Лайт (ГВВЛ)?","answer":"Генератор водородной воды AkvaLife Lite производится в Китае, в городе Шэньчжэнь. Производитель — SHENZHEN CYPLER WATER TREATMENT EQUIPMENT CO., LTD.","category":"ГВВ "},{"cell":"NEW-HYDROLYSIS-IONIZATION","question":"Чем отличается ионизация от гидролиза?","answer":"ГИДРОЛИЗ vs ИОНИЗАЦИЯ\n\nГидролиз.\nМолекулы соды, растворяясь в воде, распадаются на ионы натрия \n𝑁𝑎+ и гидрокарбоната\nHCO3−\n\nИоны гидрокарбоната реагируют с водой, что приводит к образованию слабой угольной кислоты\nH2CO3  и гидроксид-ионов\nOH−\n\nHCO3− +H2O⇌H2CO3+ OH−\n \nУвеличение концентрации гидроксид-ионов\nOH− делает раствор слабощелочным, изменяя его pH в сторону щелочной реакции. \nНО! При этом нет какого-либо значительного изменения ОВП в отрицательную сторону.\nА сама угольная кислота легко распадается на воду H2O и углекислый газ CO2.\nОтрыжка обеспечена.\n\nИонизация.\n\nЗа счет электролиза и наличия полупроницаемой мембраны вода разделяется на кислотную и оснОвную. В последней не только рН меняется в сторону увеличения >7, но и формируется отрицательный ОВП.\n\nВ жизни пригодится и щелочная вода с содой и вода ионизированная с рН >7 .\nВсё завичит от преследуемой цели.\n\nДля смягчения воды и/или обезжиривания - раствор с содой.\n\nДля борьбы с окислительным стрессом, для сохранения redox-потенциала мембран клеток, для поддержки КЩР нам нужна ИОНИЗИРОВАННАЯ.","category":"Общие"},{"cell":"NEW-MAGNESIUM-SACHET-CLUMPING","question":"почему магний в упаковке- саше спрессован?","answer":"При упаковывании в стики и транспортировке цитрат магния может спрессовываться, т.к гигроскопичен. \nСпрессованность не влияет на его свойства и усвояемость для организма. \nА так же мы не добавляем в упаковки антиотслеживатели.","category":"Товары здоровья"},{"cell":"NEW-SILVER-BREASTFEEDING","question":"Как использовать серебро при грудном вскармливании?","answer":"ОТВЕТ СВК по серебру при грудном вскармливании: \nПри ГВ нужно соблюдать рекомендации ВОЗ : не более 0, 05 мг/л Ag+, т.к. широкомасштабных исследований приема воды беременными и лактирующими с большей концентрацией серебра не проводилось","category":"Серебро"},{"cell":"NEW-GVVP-WEIGHT","question":"Сколько весит генератор водородной воды Премиум (ГВВП)?","answer":"Вес ГВВП — 435 грамм.","category":"ГВВ "},{"cell":"NEW-GVVL-WEIGHT","question":"Сколько весит генератор водородной воды Лайт (ГВВЛ)?","answer":"Вес ГВВЛ — 368 грамм.","category":"ГВВ "},{"cell":"NEW-OZONATOR-IONIZER","question":"Можно ли заливать воду после озонатора в ионизатор?","answer":"Так как озонатор — прибор для генерации озона  из кислорода, используемый для дезинфекции воздуха, воды и устранения запахов путем сильного окисления!!!\nЯ не пробывал готовить воду после озонатора, но учитывая что происходит-Окисление воды, можно попробовать так : Выждать время после обработки воды озонатором (пауза 20–30 минут):Озон — нестабильный газ. Прежде чем заливать воду в ионизатор, дайте ей постоять, чтобы избыточный озон распался обратно до обычного кислорода. А после заливайте в ионизатор воды. В теории не должно повлиять на РН . Нужно пробывать. \nСразу после озонатора НЕ рекомендую заливать в ионизатор.","category":"Общие"},{"cell":"NEW-OZONATOR-HYDROGEN","question":"Можно ли заливать воду после озонатора в генератор водородной воды?","answer":"А вот водородную воду делать после озонатора - думаю будет «конфликт интересов»!\nОзон (о3)- сильнейший Окислитель!!!\nВодород (н2)- восстановитель мощный антиоксидант!!!\n   В итоге можно получить обычную воду: озон исчезнет, а полезная концентрация водорода будет стремиться к нулю, пока весь озон не будет нейтрализован","category":"ГВВ "},{"cell":"NEW-BUILTIN-BATTERY","question":"Почему в генераторах водородной воды Аквалайф встроенный аккумулятор?","answer":"Безопасность прибора и потребителя: Работа генератора основана на электрохимическом процессе (электролизе). Встроенная батарея обеспечивает стабильную передачу тока на электроды без лишних переходных сопротивлений, которые могут возникнуть на контактах съемного аккумулятора. Так же заводская сборка со встроенным аккумулятором гарантирует правильную работу контролера заряда и самого прибора. То есть со временем потерь питания на быстросъёмных контактах съёмного аккумулятора не будет и не будет случаев установки аккумулятора похожего по габаритам, но не подходящего по характеристикам (может привести к не правильной работе или поломке). В любых случаях гарантийных или не гарантийных, хотя аккумулятор считается «несъемным» для пользователя, в нашем сервисном центре его могут заменить, разобрав прибор и установить качественный аккумулятор (оригинальный) и правильно.\n Ресурс самого генератора (мембраны, электродов) почти сопоставим со сроком службы качественного аккумулятора (при правильной эксплуатации). То есть к моменту выхода аккумулятора из строя, прибору уже потребуется глубокое сервисное обслуживание или замена самого прибора (что выгодней и удобней для клиента).       \n\n Компактность и дизайн: Съемный аккумулятор требует наличия дополнительных пазов, защелок и стенок для батарейного отсека, что увеличивает габариты прибора и вес. Встроенный аккумулятор позволяет сохранить тонкий и эргономичный дизайн и малый вес прибора. То-есть вес и габариты прибора важны для мобильного прибора, который часто берут в дорогу.","category":"ГВВ "},{"cell":"NEW-CERAMIC-DIAPHRAGM","question":"Почему Аквалайф не использует керамические мембраны перегородки?","answer":"Керамические перегородки действительно используются в некоторых ионизаторах. У них есть плюс — сама керамика (обожжённая глина) очень прочная и как материал может служить долго.\n\nНо корректнее называть её не мембраной, а диафрагмой.\nМембрана в электрохимии обычно означает ионообменный материал, который селективно пропускает определённые ионы. А пористая керамика работает иначе — она просто механически разделяет камеры и замедляет смешивание воды через микропоры.\n\nИз-за этого полностью разделить процессы не получается. Через поры постепенно проходят:\n\n— молекулы воды\n— ионы (в том числе H⁺ и OH⁻)\n— часть растворённых газов (водород и кислород).\n\nПоэтому происходит частичное обратное смешивание продуктов электролиза, что может снижать эффективность разделения и стабильность параметров воды.\n\nЧто касается «вечности». Сама керамика действительно почти не разрушается, но в процессе работы в порах постепенно откладываются соли кальция и магния. Уксус или лимонная кислота помогают удалить часть карбонатных отложений, но в основном в поверхностном слое. Внутри пористая структура со временем всё равно остаётся частично забитой.\n\nПоэтому на практике такие диафрагмы обычно работают более-менее корректно около 3–5 лет, после чего эффективность разделения постепенно снижается, особенно если вода жёсткая.","category":"Общие"},{"cell":"I9","question":"Сколько служат приборы: Флагман, Лайт, Мини?","answer":"Флагман, до 12 лет Лайт до 12 лет. Мини до 7 лет","category":"Общие"},{"cell":"E5","question":"Вопрос нужна ли выдержка при изготовлении серебряной воды, так как серебро не растворяется, его видно","answer":"При изготовлении серебряной воды выдержка не является обязательной, но может быть полезной. Серебро действительно не растворяется в воде в значительных количествах, и его частицы могут оставаться видимыми. Однако, для получения более однородного раствора и улучшения распределения частиц серебра в воде, выдержка может помочь.","category":"Серебро"},{"cell":"F5","question":"Не могу пить воду отдает пластиком?","answer":"Запах ионизированной воды зависит от состава исходной воды.  Корпус кувшина «Аквалайф» выполнен из долговечного пищевого пластика, в соответствии с ГОСТ Р 50962-96 «Посуда и изделия хозяйственного назначения из пластмасс». Настоящий стандарт распространяется на посуду, изделия культурно-бытового и хозяйственного назначения (в том числе детского ассортимента) из пластмасс и устанавливает общие требования к продукции, а также обязательные требования, направленные на обеспечение ее безопасности для жизни, здоровья, имущества населения и охраны окружающей среды. \nВ процессе ионизации вредные вещества в воду не выделяются.\n","category":"Щелочная вода"},{"cell":"G5","question":"Можно ли кипятить кислотную воду?","answer":"Кипячение кислотной воды может привести к потере растворенных газов, таких как водород (если вода дополнительно обогащена водородом), и выпадению в осадок некоторых минералов, что изменит ее pH и общее качество.\n","category":"Кислотная вода"},{"cell":"K9","question":"Какой состав у «Цикла Кребса Плюс»?","answer":"Экстракт чаги — 30%.\nЭкстракт плодов граната — 30%.\nЭкстракт чёрной смородины — 24%.\nЭкстракт корня солодки — 15%.\nАскорбиновая кислота — 1%.","category":"Товары здоровья"},{"cell":"H5","question":"Зачем нужна водородная вода?","answer":"Водородная вода, обогащенная молекулярным водородом (H₂), в последние годы привлекает все больше внимания как потенциальный источник пользы для здоровья. Заявления о ее чудодейственных свойствах варьируются от замедления старения до улучшения спортивных результатов. Но зачем же на самом деле нужна водородная вода и что стоит за этими утверждениями?\n\n\nОсновная причина интереса к водородной воде заключается в ее предполагаемом антиоксидантном действии. Молекулярный водород, как утверждается, способен нейтрализовать свободные радикалы в организме, которые являются причиной окислительного стресса и клеточного повреждения. Окислительный стресс связан с развитием множества заболеваний, включая сердечно-сосудистые заболевания, рак и нейродегенеративные расстройства.\n\n\nКроме того, исследования показывают, что водородная вода может обладать противовоспалительным эффектом. Воспаление – это естественная реакция организма на травму или инфекцию, но хроническое воспаление может приводить к различным заболеваниям. Считается, что водород способен снижать уровень маркеров воспаления в организме.\n\n\nНекоторые исследования также указывают на потенциальную пользу водородной воды для улучшения спортивных результатов. Водородная вода снижает усталость, ускорять восстановление после тренировок и улучшать гидратацию.","category":"Водородная вода"},{"cell":"I5","question":"Что такое тестовый период?","answer":"Каждому покупателю мы даем возможность убедиться в полезности ионизатора воды. Тетовый период по договору составляет 90 дней с момента получения продукции на руки. В этот период ионизатор можно вернуть и мы возвращаем полную стоимость покупки. С договором можно ознакомиться у нас на сайте ","category":"Общие"},{"cell":"J5","question":"Из чего изготовлен материал картриджа, где хранятся минералы? ","answer":"Пищевой нетканый материал","category":"ГВВ "},{"cell":"K5","question":"Как пихта повышает железо?","answer":"В составе Сока Байкальской пихты большое содержание железа, витамин C и другие растительные соединения. Механизм такой: \n1. Источник железа. Сок содержит железо, которое организм использует для образования гемоглобина.\n2. Витамин C улучшает всасывание железа в кишечнике.\n3. Мальтол и другие соединения пихты, улучшают усвоение железа.","category":"Товары здоровья"},{"cell":"L5","question":"Какой адаптер у Аксона?","answer":"Выходное напряжение: 5 В\nТок: не менее 300 мА\nРазъём питания: USB Type-A на адаптере, кабель USB-A — USB-C к аппарату","category":"Тронитек"},{"cell":"M5","question":"Применение щелочной и водородной воды для глаз?","answer":"Для промывания глаз щелочная вода не рекомендуется. Отклонение pH от естественной среды глаза может вызвать раздражение и повреждение тканей, в то время, как водородная вода обогащена молекулярным водородом, который связан с улучшением стабильности слёзной плёнки и уменьшением некоторых симптомов сухости глаз.","category":"Разные вопросы "},{"cell":"I26","question":"Почему под колпачками в области прикрутки электрода образуется ржавчина и болты крепления так же ржавые?","answer":"Влага, проникающая под колпачок, действует как электролит, замыкая цепь и ускоряя процесс коррозии. Поэтому нужно правильно класть крышку прибора, электродами вниз или параллельно столу, чтобы вода не затекала под колпачки.\nНеобходимо регулярно проверять состояние колпачков и контактов, чтобы своевременно выявлять признаки коррозии и принимать меры по их устранению.","category":"Общие"},{"cell":"F22","question":"Какая плотность у щелочной воды?","answer":"Плотность ионизированной щелочной воды, как и обычной воды, приблизительно составляет 1 грамм на кубический сантиметр (1 г/см³) или 1000 килограмм на кубический метр (1000 кг/м³)","category":"Щелочная вода"},{"cell":"E14","question":"Как правильно хранить серебряную воду?","answer":"Хранить серебряную воду в темном месте и в стеклянной посуде, с закрытой крышкой, чтобы избежать разрушения коллоидов под воздействием света. При длительном хранении воду с серебром нужно перемешать перед использованием.","category":"Серебро"},{"cell":"I18","question":"Размер Анода (мини)","answer":"выступающая часть от колпака 95 мм на 30 мм","category":"Общие"},{"cell":"F14","question":"Можно ли повторно ионизировать воду?","answer":"Этот вопрос затрагивает несколько аспектов, связанных с физико-химическими свойствами ионизированной воды и её стабильностью.\n\n\nИонизированная вода, полученная путем электролиза, характеризуется измененным pH (повышенным для щелочной и пониженным для кислотной воды) и содержанием ионов. Эти изменения обусловлены разделением воды на ионы водорода (H+) и гидроксида (OH-). Однако, со временем, ионизированная вода стремится вернуться к своему первоначальному состоянию из-за естественных процессов диффузии и взаимодействия с окружающей средой.\n\n\nЧерез 24 часа, даже без добавления свежей воды, ионизированная вода частично утрачивает свои первоначальные свойства. Растворенные газы (например, углекислый газ) абсорбируются из воздуха, что влияет на pH. Кроме того, ионы постепенно рекомбинируют, возвращая воду к нейтральному состоянию.\n\n\nДобавление 50% свежей воды приведет к значительному снижению концентрации ионов, присутствующих в исходной ионизированной воде. Эффект будет заключаться в разбавлении, что уменьшит как pH (в случае щелочной воды), так и окислительно-восстановительный потенциал (ОВП).\n\n\nТеоретически, повторная ионизация возможна. Однако, эффективность повторной ионизации будет зависеть от нескольких факторов: мощности ионизатора, качества исходной воды (свежей воды) и желаемого уровня pH и ОВП.\n\n\nВ заключение, хотя повторная ионизация и возможна, конечный результат будет отличаться от первичной ионизации, а стабильность полученной воды может быть ниже. Важно помнить, что свойства ионизированной воды подвержены изменениям, и свежеприготовленная ионизированная вода обычно обладает наиболее выраженными","category":"Щелочная вода"},{"cell":"H14","question":"Какие характеристики насыщения водородом у генераторов водородной воды Premium (ГВВП), Light (ГВВЛ) и ионизаторов AkvaLife?","answer":"ГВВП -Низкомолекулярный водород двух режимов 2 мин (ОВП - 300, 600 ррb)  и 10 мин (ОВП - 500 и 1000 ppb)\nГВВЛ - овп -300, 600 ррb\nИонизатор - В наших ионизаторах воды количество водорода 220-250 рpb ОВП минус 100","category":"Водородная вода"},{"cell":"E10","question":"Изменение свойств ионизированной воды при хранении и возможности повторной ионизации.","answer":"Если ионизированная вода постоит некоторое время, концентрация ионов H⁺ и OH⁻ будет постепенно стремиться к равновесию, восстанавливая исходное соотношение, характерное для нейтральной воды. Это происходит из-за диффузии, реакции рекомбинации и поглощения газов из атмосферы. Таким образом, через некоторое время вода вернется к своему первоначальному состоянию, и процесс ионизации можно будет повторить.","category":"Серебро"},{"cell":"I14","question":"Размер Аквалайф Лайт (ш/д/в и вес)?","answer":"Наш прибор весит 1260 гр. Высота прибора 26 см Ширина с ручкой 30 см","category":"Общие"},{"cell":"F10","question":"Можно ли кипятить щелочную воду перед ионизацией?","answer":"кипячение щелочной воды перед ионизацией- это процедура, которая не дает значительных преимуществ.Хотя кипячение может незначительно повлиять на химический состав воды, эти изменения обычно не являются значительными и могут даже негативно повлиять на процесс ионизации. В частности, образование осадка из-за кипячения жесткой воды может снизить эффективность ионизатора.","category":"Щелочная вода"},{"cell":"G10","question":"Почему нет рецептов как лечиться?","answer":"В связи с авторскими провами рецептник больше не выпускается, но мы с радостью ответим на вопросы по телефону и так же клиента можно пригласить в чат тг и дать ссылку на наш ютуб канал","category":"Общие"},{"cell":"E6","question":"Как пить серебрянную воду?","answer":"\"1. Серебряную можно пропить концентрацией 0,01мг/л - 0,05мг/л, в объёме к весу (30мл/кг веса тела),  курсом 2 -3 недели (в целом не более месяца, в зависимости от состояния иммунитета), затем делаем перерыв 3-4 месяца (до полугода), затем курс можно повторить.\n2. Серебряную воду можно выпить концентрацией 0,1мг/л - 0,5мг/л, по полстакана за полчаса до еды. Пьём в течение 3-5-7 дней, в зависимости от самочувствия.\"","category":"Серебро"},{"cell":"I10","question":"Гарантийный срок на ионизаторы? А если гарантия закончилась то прибор больше не будет работать?","answer":"Аквалайф РФ - гарантия 4 года. Аквалайф Лайт - гарантия 3 года, Аквалайф Мини - гарантия 2 года. Если закончилась гарантия, прибор работать будет, т.к. у приборов есть срок службы. Аквалайф РФ до 12 лет  и Лайт - срок службы 10 лет, Аквалайф Мини - срок службы 7 лет.","category":"Общие"},{"cell":"G6","question":"Как еще можно применять кислотную воду?","answer":"1. Борьба с мелкими вредителями растений 2.Дезинфекция диетических яиц 3. Дезинфекция лица, рук  4.Дезинфекция пола, мебели, инвентаря 5. Дезинфекция помещений 6.Дезинфекция различной тары  7. Лечение поноса домашней птицы, животных 8. Обезвреживание ульев, сот, инвентаря пчеловода 9. Обезжиривание поверхностей стекол 10. Оживление увядших цветов, зеленых овощей 11. Смягчение воды 12.Стерилизация банок, крышек 13. Стимуляция роста птицы 14. Стимуляция роста, улучшение аппетита домашнего скота 15. Стирка белья, одежды при экономии моющих средств 16. Поение телят щелочной водой 17. Подготовка семян к посадке. Стимуляция роста растений в теплицах, на огороде 18. Приготовление сиропа для пчел 19. Проращивание зерна для еды, ячменя для солода 20.Увеличение срока хранения овощей, фруктов 21. Улучшение роста и цветения комнатных цветов 22.Улучшение вкуса, аромата кофе, чая 23.Профилактика и ликвидация неприятного запаха из канализационных труб 24.Профилактика и устранение неприятного запаха изо рта 25. Вывод токсинов и оксидантов из вашего организма и оздоровление","category":"Кислотная вода"},{"cell":"K10","question":"Можно ли пить ЦК и Пихту ребенку?","answer":"Да можно в половине дозы","category":"Товары здоровья"},{"cell":"H6","question":"Можно ли кипятить водородную воду перед ионизацией?","answer":"Вопрос о кипячении серебряной, щелочной или водородной воды поднимает важные аспекты, связанные с сохранением их специфических свойств.\nСеребряная вода, известная своими антибактериальными свойствами, получается путем электролиза. Кипячение серебряной воды теоретически не должно существенно повлиять на содержание ионов серебра, если процесс проводится в чистой емкости. Однако, высокая температура может способствовать выпадению в осадок некоторых соединений серебра, что снизит концентрацию активных ионов.\nКипячение щелочной воды может привести к потере растворенных газов, таких как водород (если вода дополнительно обогащена водородом), и выпадению в осадок некоторых минералов, что изменит ее pH и общее качество.\nВодородная вода, содержащая растворенный молекулярный водород, ценится за свои антиоксидантные свойства. Кипячение водородной воды приведет к практически полной потере растворенного водорода, так как водород – очень легкий газ, легко улетучивающийся при нагревании. Таким образом, кипячение полностью лишит водородную воду ее целебных свойств.\nВ заключение, кипячение серебряной воды допустимо, но может несколько снизить ее эффективность. Щелочную воду кипятить не рекомендуется из-за возможных изменений pH и минерального состава. А кипячение водородной воды полностью нивелирует ее полезные свойства. Для сохранения полезных свойств рекомендуется избегать кипячения этих видов воды.","category":"Водородная вода"},{"cell":"I6","question":"По какому принципу готовится вода?","answer":"\"Ионизатор представляет собой емкость с электродами, подсоединенными к источнику, обеспечивающему постоянное напряжение.\nЭлектролиз приводит к появлению щелочной воды на стороне катода и кислотной на стороне анода.\"","category":"Общие"},{"cell":"J6","question":"Почему ГВВП дорогая?","answer":"Почему генератор водородной воды AkvaLIFE стоит именно столько?\nНаша цена — это не просто стоимость устройства. Это стоимость технологий, качественных материалов и продуманной конструкции, которые стоят за каждой деталью.\nМы используем титановый электрод с платиновым покрытием и высококачественную ионную мембрану DuPont N117 с платиновым покрытием. Эти компоненты являются важной частью электрохимической системы генератора и влияют на его работу.\nМы продумали устройство так, чтобы вы могли пользоваться им каждый день: встроенный аккумулятор, удобная зарядка USB-C, качественные материалы корпуса и два режима приготовления водородной воды.\nМы не стремимся предложить самую низкую цену на рынке. Наша цель — предложить устройство, в котором стоимость обусловлена технологиями, материалами и функциональностью.\nВыбирая AkvaLIFE, вы выбираете не просто генератор водородной воды, а технологичное устройство, созданное для вашего ежедневного использования.\nAkvaLIFE — внимание к деталям, технологии в каждой детали.","category":"ГВВ "},{"cell":"K6","question":"Сколько элементарного Магния в Цитрате магния?","answer":"350 мг цитрата магния соответствует 14,7 % элементарного магния т.е. 51,5мг","category":"Товары здоровья"},{"cell":"L6","question":"Какие батарейки у ПКМ?","answer":"Для аппарата «НейроДЭНС-ПКМ» нужны 2 батарейки AA (пальчиковые), тип LR6, по 1,5 В каждая. \n\n","category":"Тронитек"},{"cell":"I31","question":"Почему сертификаты у ГВВ из Киргизии?","answer":"Сертификаты, как и декларации, имеют одинаковую юридическую силу и являются равноценными, так как и Киргизия, и Россия входят в таможенный союз (ТС)","category":"Общие"},{"cell":"F23","question":"Почему нагревается щелочная вода? иногда не нагревается.","answer":"Вода в ионизаторе может нагреваться по нескольким причинам.\n\n1. Установленный уровень pH. Чем выше заданный показатель pH, тем дольше в некоторых моделях ионизаторов может продолжаться процесс электролиза. Например, при установке pH 8,2 приготовление воды может занимать около 1,5 минуты, а при pH 9,4 — значительно дольше, вплоть до 15 минут, в зависимости от модели и режима работы прибора.\nЧем дольше работает ионизатор, тем больше может нагреваться вода и внутренние компоненты устройства. Загрязнение катода и электродов. Минеральные отложения и накипь могут ухудшать работу электродов и приводить к нагреванию, также количество и состав растворённых минералов влияют на электропроводность и ток при электролизе. При высокой или низкой минерализации работа прибора может затрудняться, что приводит к нагреванию.","category":"Щелочная вода"},{"cell":"E19","question":"Можно ли кипятить серебряную воду перед ионизацией?","answer":"Вопрос о кипячении серебряной, щелочной или водородной воды поднимает важные аспекты, связанные с сохранением их специфических свойств.\nСеребряная вода, известная своими антибактериальными свойствами, получается путем электролиза. Кипячение серебряной воды теоретически не должно существенно повлиять на содержание ионов серебра, если процесс проводится в чистой емкости. Однако, высокая температура может способствовать выпадению в осадок некоторых соединений серебра, что снизит концентрацию активных ионов.\nКипячение щелочной воды может привести к потере растворенных газов, таких как водород (если вода дополнительно обогащена водородом), и выпадению в осадок некоторых минералов, что изменит ее pH и общее качество.\nВодородная вода, содержащая растворенный молекулярный водород, ценится за свои антиоксидантные свойства. Кипячение водородной воды приведет к практически полной потере растворенного водорода, так как водород – очень легкий газ, легко улетучивающийся при нагревании. Таким образом, кипячение полностью лишит водородную воду ее целебных свойств.\nВ заключение, кипячение серебряной воды допустимо, но может несколько снизить ее эффективность. Щелочную воду кипятить не рекомендуется из-за возможных изменений pH и минерального состава. А кипячение водородной воды полностью нивелирует ее полезные свойства. Для сохранения полезных свойств рекомендуется избегать кипячения этих видов воды.","category":"Серебро"},{"cell":"I23","question":"Почему на черном электроде появляются радужные разводы?","answer":"Появление радужных разводов на черном электроде (обычно катоде) при электролизе – это визуальный эффект, обусловленный комплексом физико-химических процессов, происходящих на поверхности металла. Эти разводы, переливающиеся всеми цветами радуги, являются следствием образования тонкой пленки на поверхности электрода и интерференции света в этой пленке.\nРадужные разводы – это просто визуальный эффект, не оказывающий существенного влияния на качество воды.","category":"Общие"},{"cell":"F19","question":"Можно ли использовать для питья \"живую\" воду при желчекаменной болезни?","answer":"Можно, при ЖКБ следует быть осторожными с желчегонными, можно пить воду pH 8,5 - 8,7","category":"Щелочная вода"},{"cell":"E15","question":"Колоидное серебро - какого размера частицы серебра получаются в воде и соединяются ли они в более крупные частицы в воде и в организме?","answer":"Колоидное серебро состоит из мелких частиц серебра, которые обычно имеют размер от 1 до 100 нанометров. Эти частицы находятся в дисперсной форме в жидкости, такой как вода, и не оседают на дно благодаря своему малому размеру и взаимодействиям с молекулами воды.\n\nВ воде частицы коллоидного серебра могут взаимодействовать друг с другом, но при нормальных условиях они остаются в коллоидном состоянии и не образуют более крупные агрегаты. Однако при изменении условий, таких как изменение pH, температуры или концентрации, возможно образование более крупных агрегатов.","category":"Серебро"},{"cell":"I19","question":"Размер Катода (мини)","answer":"выступающая часть от колпака 95 мм на 30 мм","category":"Общие"},{"cell":"F15","question":"Какую воду заливать в прибор?","answer":"В прибор можно заливать воду которая соответствует САН ПИНу (ГОСТУ)   водопроводную, после очистителя воды , например \"Барьер\" либо бутилированную минерализация воды должна быть от 50-1000 единиц","category":"Щелочная вода"},{"cell":"I15","question":"Габариты Аквалайф Мини (ш/д/в и вес)?","answer":"Высота прибора 19 см, длина 18.5 см, Диаметр 15.5 см вес 1 кг","category":"Общие"},{"cell":"F11","question":"Что лечит щелочная вода?","answer":"Щелочная вода не лечит, а используется для профилактики разных заболеваний,  используется в качестве средства для улучшения здоровья. Преимущества щелочной воды включают:\n\nУлучшение пищеварения: Щелочная вода может помочь нейтрализовать избыточную кислоту в желудке, что может облегчить симптомы изжоги и гастрита.\n\nГидратация: исследования показывают, что щелочная вода лучше усваивается организмом и способствует более эффективной гидратации.\n\nАнтиоксидантные свойства: Щелочная вода содержит антиоксиданты, которые помогают бороться с окислительным стрессом и свободными радикалами.\n\nПоддержка кислотно-щелочного баланса: Употребление щелочной воды поможет поддерживать оптимальный уровень pH в организме, что важно для общего здоровья.\n\nПрофилактика остеопороза: Некоторые исследования предполагают, что щелочная вода может помочь снизить уровень кальция в моче и тем самым уменьшить риск остеопороза.","category":"Щелочная вода"},{"cell":"E7","question":"Что лечит серебрянная вода?","answer":"Серебряная вода используется в альтернативной медицине и считается средством с антисептическими и противовоспалительными свойствами. Серебряная вода может помочь при различных заболеваниях, включая:\n\nИнфекции:  серебро может убивать бактерии, вирусы и грибы.\nЗаболевания кожи: Используется для лечения акне, экземы и других кожных инфекций.\nРеспираторные заболевания: применяют серебряную воду для облегчения симптомов простуды и гриппа.\nЗаболевания желудочно-кишечного тракта: вода может помочь при пищевых отравлениях и других расстройствах.","category":"Серебро"},{"cell":"I11","question":"Где есть сервисные центры?","answer":"Сервисный центр ТОЛЬКО  в Москве.","category":"Общие"},{"cell":"F7","question":"Можно антибиотики запивать щелочной или водородной водой?","answer":"Да можно, но нужно учитывать, что их действия могут усилиться, в том случаи, если ионизированную воду вы начали пить совсем недавно.","category":"Щелочная вода"},{"cell":"G7","question":"Что лечит кислотная вода?","answer":"Прибор не является медицинским прибором и не может лечит то или ионое заболевание, вода нужна для профилактики или консервативного подхода для оздоровления человеческого организма. Кислотная вода является мощным бактерицидом и имеет заживляющие свойста. ","category":"Кислотная вода"},{"cell":"K11","question":"Что такое фукоидан ","answer":"Фукоиданы — это полисахариды клеточной стенки, которые содержатся в различных видах бурых морских водорослей. Отличается от хлореллы местом произрастания, составом, скоростью фотосинтеза и тд.\nСостав: ламинария, фукус, полисахариды (длинная молекула в глюкозе) Производство Краснознаменск МО, место добычи - Белое море вблизи Соловецкого архипелага (температура произрастания около 0)","category":"Товары здоровья"},{"cell":"H7","question":"Что лечит водородная вода?","answer":"Прибор не является медицинским прибором и не может лечит то или ионое заболевание,  вода для профилактики или консервативного подхода для оздоровления человеческого организма. Водородная вода, обогащенная молекулярным водородом (H2), в последнее время привлекает все больше внимания благодаря своим потенциальным терапевтическим свойствам. \n\nОдним из ключевых преимуществ водородной воды является ее антиоксидантное действие. Молекулярный водород избирательно нейтрализует вредные свободные радикалы, такие как гидроксильный радикал (•OH), которые способствуют окислительному стрессу и повреждению клеток. Снижение окислительного стресса играет важную роль в замедлении процессов старения и профилактике хронических заболеваний, включая сердечно-сосудистые заболевания, нейродегенеративные расстройства и рак.\nИсследования также показали, что водородная вода может оказывать противовоспалительное действие. Она способна модулировать воспалительные процессы в организме, уменьшая выработку провоспалительных цитокинов. Это может быть полезно при лечении воспалительных заболеваний, таких как артрит, астма и воспалительные заболевания кишечника.\nКроме того, имеются данные о положительном влиянии водородной воды на метаболизм. Она может улучшать чувствительность к инсулину, снижать уровень глюкозы в крови и улучшать липидный профиль, что делает ее перспективным средством для профилактики и лечения сахарного диабета и метаболического синдрома.\nНекоторые исследования также указывают на потенциальную пользу водородной воды для улучшения когнитивных функций и защиты нервной системы. Она может оказывать нейропротекторное действие, защищая клетки мозга от повреждений, вызванных окислительным стрессом и воспалением. Это может быть особенно важно при лечении нейродегенеративных заболеваний, таких как болезнь Альцгеймера и болезнь Паркинсона.","category":"Водородная вода"},{"cell":"I7","question":"Почему вода нагревается или не нагревается?","answer":"Нагрев воды зависит от минерализации воды. Когда в воде минералов строго по норме СанПиН, разницу по температуре не чувствуется. Если минерализация воды ниже, либо выше нормы, прибор воду подогревает.","category":"Общие"},{"cell":"J7","question":"Сколько готовит воду ГВВЛ на одной зарядке?","answer":"Генератор водородной воды AkvaLIFE Lite на одном полном заряде готовит примерно 16 порций воды по 5 минут.","category":"ГВВ "},{"cell":"L7","question":"Какая частота работы у Аксона?","answer":"Воздействие\nимпульсами\nс квазислучайной\nчастотой\nследования\nимпульсов\nв диапазоне\n75–135 Гц","category":"Тронитек"},{"cell":"F24","question":"Что такое щелочная вода?","answer":"Щелочная вода — это вода, уровень pH которой выше 7. Она имеет щелочную, а не нейтральную или кислую реакцию.","category":"Щелочная вода"},{"cell":"I24","question":"Почему область где прикручиваешь серебряный электрод проржавела, вы не использыете нержавеющую сталь?","answer":"Влага, проникающая в месте крепления электрода , действует как электролит, замыкая цепь и ускоряя процесс коррозии. Поэтому нужно правильно класть крышку прибора, электродами вниз или параллельно столу, чтобы вода не попадала в месте крепления..\nНеобходимо регулярно проверять состояние крепления электрода и контактов, чтобы своевременно выявлять признаки коррозии и принимать меры по их устранению.","category":"Общие"},{"cell":"E16","question":"Можно ли в увлажнитель заливать серебр воду приготовленную в ионизаторе? Если можно то какой концентрации. Если нельзя то почему?","answer":"Заливать серебряную воду, приготовленную в ионизаторе, в увлажнитель не рекомендуется. Основные причины:\n\nКоррозия: Серебряная вода может содержать частицы серебра, которые могут привести к коррозии внутренних частей увлажнителя, особенно если он сделан из металла.\n\nЗасорение: Частицы серебра могут забивать фильтры и другие компоненты устройства, что приведет к его поломке или снижению эффективности.\n\nБезопасность: Хотя серебро обладает антимикробными свойствами, его использование в увлажнителе может привести к образованию аэрозолей с частицами серебра, что может быть небезопасно для дыхательных путей.","category":"Серебро"},{"cell":"I20","question":"Длина сетевого провода Аквалайф/ Аквалайф Лайт?","answer":"Длина сетевого кабеля ионизатора Аквалайф Флагман составляет 168 см","category":"Общие"},{"cell":"F16","question":"Консультация почему щелочная вода пахнет после ионизации кислотной хлористой","answer":"Важно понимать, что ионизация воды – это электрохимический процесс, который разделяет воду на щелочную (с повышенным pH) и кислотную (с пониженным pH) фракции. Хлористая кислота, образующаяся в кислотной фракции, содержит хлор, который может быть причиной неприятного запаха.","category":"Щелочная вода"},{"cell":"C12","question":"Что делать если ошибка нет воды из-за недостатка минералов в воде?","answer":"Когда в воде отмечается недостаточная концентрация минералов, устройство может выдавать сообщение об ошибке, сигнализирующее об отсутствии воды. Причина этого кроется в том, что при электролизе недостаток солей в воде препятствует нормальной проводимости электрического тока. Чтобы решить эту проблему, рекомендуется добавить в воду немного соли. Для этой цели прекрасно подойдет гималайская соль, доступная в магазинах. Она полезна для здоровья, так как содержит значительное количество йода и магния. Добавьте всего 2-3 небольших кристаллика на 3,5 литра воды, и прибор должен начать функционировать правильно.","category":"Ошибки"},{"cell":"E12","question":"Почему серебр. электрод облез?","answer":"Серебр. элетрод сделан из серебра пробы 999.9. Он без напыления поэтому облазить в нем нечему. Однако у серебра есть свойство окисляться попадая на воздух после взаимодействия с водой. И темный или светлый налет на электроде об этом говорит ","category":"Серебро"},{"cell":"I16","question":"Размер Анода (аквалайф)","answer":"188.5 мм длина , ширина в верху 45 мм, внизу 32, 5 мм","category":"Общие"},{"cell":"F12","question":"Где найти информацию о пользе воды AkvaLife?","answer":"На нашем сайте, на наших YouTube- и Rutube-каналах, в наших Telegram-каналах, рекомендованных Telegram-каналах и видео. Вся информация собрана во вкладке «Полезные ссылки».","category":"Щелочная вода"},{"cell":"H12","question":"Как правильно хранить водородную воду?","answer":"Идеальным материалом для хранения водородной воды считается стекло. Оно не вступает в реакцию с водой, не выделяет вредных веществ и хорошо сохраняет её свойства.  \nВажно помнить, что водородная вода чувствительна к контакту с воздухом, поэтому ёмкость для хранения должна быть герметичной. ","category":"Водородная вода"},{"cell":"I12","question":"Выход шнура из крышки находится не в очень удобном месте. Как его обезопасить?","answer":"Шнур установлен безопасно, во избежании заломов не нужно класть крышку на сторону сетевого провода, а при эксплуотации достаточно обернуть вокруг крышки и крышку вернуть в кувшин крест накрест.","category":"Общие"},{"cell":"F8","question":"Какой рН нужно пить каждый день? Какой рН пить детям?","answer":"Каждый день можно употреблять питьевые показатели от 8.5-9.4 пш, если человек живет в большом городе то оптимально пить 9.0. Дети могут употреблять с 10 лет как взрослые, до 10 лет достаточно 8.5 пш, если ребенок очень маленький то ближе к нейтральному пш, так как маленькие дети считаются ощелаченными и им не требуется повышенный показатель.","category":"Щелочная вода"},{"cell":"G8","question":"Где почитать о пользе кислотной воды?","answer":"О кислотной воде вы можете прочитать в инструкции прибора в рубрике \"Часто задаваемые вопросы.\"","category":"Кислотная вода"},{"cell":"G8-2","question":"Как применять кислотную воду при гипертонии?","answer":"при гипертоническом кризе выпивается полстакана кислотной воды с рН 2,5-3,0. А через час выпивается стакан щелочной воды","category":"Кислотная вода"},{"cell":"G8-3","question":"Как пить водородную воду при гипертонии?","answer":"Применять мы рекомендуем водородную воду при гипертонии курсом 30 дней , таким образом наш организм подготавливается к питью щелочной воды, так как в водородной воде меняется только показатель ОВП а pH остается нейтральным + появляется молекулярный водород (антиоксидант)","category":"Водородная вода"},{"cell":"K12","question":"Чем наш фукоидан отличается от конкурентов ","answer":"Если сравнивать не просто ламинарии и водоросли. А провести сравнение между фукоиданами, то наш фукоидан выделен и изготавливается отечественными учеными НИИ пищевой биотехнологии. Разработчик, Александр Лемтюгин, получил \"Звезду И. И. Мечникова\" за разработку и исследования фукоидана.\nТак же важно место произрастание водорослей. Водоросли, обитающие в суровых климатических условиях Белого моря, накапливают огромные количества адаптогенов — веществ, помогающих нашему организму справляться со стрессами и болезнями. Чем жестче климат, тем больше полезных веществ содержится в этих растениях! Это, как и с вином, лоза должна страдать чтобы вино получилось отменным\n","category":"Товары здоровья"},{"cell":"I8","question":"Чьё это производство?","answer":"Мы сами компания производитель. Юридический адрес - 140153, Московская обл., р-он Раменский, с. Быково, ул. Театральная, 10, офис А217. / Или можно сказать что наше производство это целая группа российский компаний. А именно анодные электроды поставляет научно производственное предприятие Экофес г Новочеркасск, Серебр электрод \"МЗЦ\" г косторма, Катодные элетроды \"Пелетон\", Мембраны \"РН Нанотех\" , Дизайн корпуса \"ДизайнВоркс\"","category":"Общие"},{"cell":"J8","question":"Сколько готовит воду ГВВП на одной зарядке?","answer":" При полном заряде генератора на 2 минуты до 50 приготовлений и на 10 минут 15 приготовлений.","category":"ГВВ "},{"cell":"L8","question":"По какому принципу работает Аксон?","answer":"Предназначен для воздействия импульсами электрического тока низкой частоты на область \nострой и хронической боли и очаги повреждений (травм)","category":"Тронитек"},{"cell":"I29","question":"Какой пластик в кувшине?","answer":"Корпус кувшина «Аквалайф» выполнен из долговечного пищевого пластика, в соответствии с ГОСТ Р 50962-96 «Посуда и изделия хозяйственного назначения из пластмасс». Настоящий стандарт распространяется на посуду, изделия культурно-бытового и хозяйственного назначения (в том числе детского ассортимента) из пластмасс и устанавливает общие требования к продукции, а также обязательные требования, направленные на обеспечение ее безопасности для жизни, здоровья, имущества населения и охраны окружающей среды. \nВ процессе ионизации вредные вещества в воду не выделяются.","category":"Общие"},{"cell":"F25","question":"Как сделать замер воды? ","answer":"Подготовка воды для измерения pH-тестером\n\nЧтобы лучше увидеть результат, подготовьте щелочную воду с уровнем pH 9,4.\n\nЧтобы провести измерение, подготовьте три отдельные емкости. В каждую налейте по 5 мл воды (примерно одна чайная ложка).\n\nИсходная вода — например, водопроводная.\n\nЩелочная вода — перед отбором пробы тщательно перемешайте.\n\nКислотная вода — используйте готовый образец.\n\nПроведение измерений\n\nПодготовьте три емкости с образцами воды.\n\nВ каждую емкость добавьте по 4–5 капель индикаторного реактива.\n\nДождитесь изменения цвета и сравните результаты либо измерьте pH с помощью pH-тестера.\n\nОжидаемые результаты при использовании индикатора\n\nСалатовый — исходная вода.\n\nТемно-зеленый — щелочная вода.\n\nЖелтый — кислотная вода.","category":"Щелочная вода"},{"cell":"I25","question":"Что такое антиоксиданты","answer":"Антиоксиданты - это основные помощники в борьбе с агрессивным влиянием свободных радикалов. Они подавляют окислительное действие. С возрастом  и при большом количестве свободных радикалов организм сам не справляется и ему требуется дополнительный источник извне: еда и вода. Антиоксидантами богата щелочная ионизированная вода, водородная вода, а так же овощи и зелень. Японскими учеными доказано, что водород более мощный антиоксидант в 176 раз чем витамин С","category":"Общие"},{"cell":"E17","question":"Серебрянная вода как пить/какой концентрации. Как хранить. Общая информация ","answer":"\"Серебряная вода:\n- 0.01          мг/л можно пить всегда и даже маленьким детям.\n- 0.02-0.05 мг л можно пить до 3 х месяцев любым количеством не меньше 1 литра в сутки. Общая профилактика организма.\n- 0.10 -0.50 мг/л можно пить по 1 литру в течении 1 месяца для профилактики внутренних органов. \nВ эфире часто говорят о  цифре  0.11 - это так же профилактика внутренних органов.\nСеребряную питьевую воду нельзя кипятить и хранить больше суток, нельзя нагревать выше 36 градусов. Та часть воды которая остается или выливается или используется для быта: помыть полы, протереть пыль, полить цветы.\nКонцентрация 20 мл/л -40 мг/л можно полоскать горло, спринцеваться, делать компрессы. Такая вода ранится от 6 месяцев до трех лет.\nХранить строго в сосуде из стекла , керамики, глины или дерева. Сосуд должен быть зачехлен. серебряная вода боится света, когда вступает в реакцию с UF темнеет (теряет свойства). \n\"","category":"Серебро"},{"cell":"I21","question":"Длина сетевого провода Аквалайф Мини?","answer":"Длина сетевого провода 120 см","category":"Общие"},{"cell":"F17","question":"Как правильно хранить щелочную воду?","answer":"Использовать в течение 8–12 часов после приготовления. Хранить в стеклянной, плотно закрытой (герметичной) таре.","category":"Щелочная вода"},{"cell":"E13","question":"Какую концентрацию серебр. воды можно делать на щелочной?","answer":"Во-первых, необходимо понимать, что щелочная вода имеет повышенный pH (обычно выше 7) благодаря присутствию гидроксид-ионов (OH-). В такой среде ионы серебра могут взаимодействовать с гидроксид-ионами, образуя гидроксид серебра (AgOH). Гидроксид серебра – это нестойкое соединение, которое быстро разлагается на оксид серебра (Ag2O), выпадающий в осадок, и воду. Таким образом, в щелочной среде серебро не остается в растворенном ионном виде, что необходимо для его антимикробных свойств.","category":"Серебро"},{"cell":"I17","question":"Размер Катода (аквалайф)","answer":"188.5 мм длина , ширина в верху 45 мм, внизу 32, 5 мм","category":"Общие"},{"cell":"H13","question":"Сколько водорода в водородной воде и какой ОВП в ионизаторах?","answer":"ГВВП -Низкомолекулярный водород двух режимов 2 мин (ОВП - 300, 600 ррb)  и 10 мин (ОВП - 500 и 1000 ppb)\nГВВЛ - овп -300, 600 ррb\nИонизатор - В наших ионизаторах воды количество водорода 220-250 рpb ОВП минус 100","category":"Водородная вода"},{"cell":"I13","question":"Размер Аквалайф (ш/д/в и вес)?","answer":"Наш прибор весит 1260 гр. Высота прибора 26 см Длина с ручкой 30 см Ширина 15 см","category":"Общие"},{"cell":"F9","question":"Как еще можно применять щелочную и кислотную воду?","answer":"1. Борьба с мелкими вредителями растений 2.Дезинфекция диетических яиц 3. Дезинфекция лица, рук  4.Дезинфекция пола, мебели, инвентаря 5. Дезинфекция помещений 6.Дезинфекция различной тары  7. Лечение поноса домашней птицы, животных 8. Обезвреживание ульев, сот, инвентаря пчеловода 9. Обезжиривание поверхностей стекол 10. Оживление увядших цветов, зеленых овощей 11. Смягчение воды 12.Стерилизация банок, крышек 13. Стимуляция роста птицы 14. Стимуляция роста, улучшение аппетита домашнего скота 15. Стирка белья, одежды при экономии моющих средств 16. Поение телят щелочной водой 17. Подготовка семян к посадке. Стимуляция роста растений в теплицах, на огороде 18. Приготовление сиропа для пчел 19. Проращивание зерна для еды, ячменя для солода 20.Увеличение срока хранения овощей, фруктов 21. Улучшение роста и цветения комнатных цветов 22.Улучшение вкуса, аромата кофе, чая 23.Профилактика и ликвидация неприятного запаха из канализационных труб 24.Профилактика и устранение неприятного запаха изо рта 25. Вывод токсинов и оксидантов из вашего организма и оздоровление","category":"Щелочная вода"},{"cell":"B5","question":"Почему мембрана воняет химией?","answer":"Мембрана изготовлена из материалов, которые не издают запахов. Чаще всего неприятные запахи связаны с химическим составом исходной водой. Например, хлор. Некоторые пользователи бывают очень чувствительны и им ощущается, что мембрана имеет посторонние запахи.","category":"Мембраны"},{"cell":"J13","question":"Сколько водорода в водородной воде и какой ОВП в генераторах?","answer":"ГВВП -Низкомолекулярный водород двух режимов 2 мин (ОВП - 300, 600 ррb)  и 10 мин (ОВП - 500 и 1000 ppb)\nГВВЛ - овп -300, 600 ррb\nИонизатор - В наших ионизаторах воды количество водорода 220-250 рpb ОВП минус 100","category":"ГВВ "},{"cell":"G9","question":"Почему кислотная вода не кислая ?","answer":"На кислоту кислотной воды влияет несколько факторов. Во- первых это химический состав воды, во -вторых, чем выше вы поставите покатель pH, тем вода будет кислее. ","category":"Кислотная вода"},{"cell":"K13","question":"Какое содержание натрия углекислого (соды) в магние? ","answer":"В одном стике содержится 0,152 грамма натрия углекислого кислого или в народе называют пищевой содой. Мы используем чистые ингредиенты с чистотой до 99,9%, поэтому предпочитаем использовать химические наименования.","category":"Товары здоровья"},{"cell":"B7","question":"Как долго служат мембраны?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\t1) Аквалайф РФ служат от 1-2 лет:\n2.) Аквалайф мини до 3х недель\n3.) Аквалайф серия 2 -до 3х месяцев,\n4.) Авалайф серия 1 до 4 недель.\nДля мембран Премиум и Лайт Аквалайф:\nМембрану пора заменить если: порвалась, расклеилась, появились отверстия от механических повреждений, опрелости в виде черных точек, мембрана изменила цвет на оранжевый или розовый, прибор выдаёт ошибку \"нет воды\"(в данном случае проверить минерализацию воды, такая ошибка возникает в случае ОСМОСной воды).\n","category":"Мембраны"},{"cell":"D9","question":"Почему гидроксид образуется иногда хлопьями на 9.4 пш, а если показатель выше всегда?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tЭто самый длительный процесс приготовления щелочной воды в ионизаторе. Когда минерализация повышена, то и гидроксид сразу появляется и могут быть взвеси. Если вы заметили такие взвеси на 9.4 пш воду лучше фильтровать перед приготовлением.\n","category":"Гидроксид"},{"cell":"E18","question":"Почему на серебряном электроде отсутствует проба?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tСеребряный электрод не является ювелирным изделием , поэтому на нем не требуется пробу. P/S: Проверить можно отнеся электрод на экспертизу.\n","category":"Серебро"},{"cell":"C9","question":"Опасный наклон","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tДанная ошибка связана с проблей неровной поверхности.\n","category":"Ошибки"},{"cell":"F21","question":"Продолжение вопроса выше: ","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tСеребряную воду в зависимости от концентрации используют как внутрь, так и снаружи\nВодородная вода используется для приема внутрь, ввиду быстрой летучести водорода- сразу после приготовления в течение 20 мин в качестве самого мощного и активного антиоксиданта с наименьшим размером молекулы, проникающим в любую клетку и преодолевающим любой барьер.\n","category":"Щелочная вода"},{"cell":"A1","question":"Почему может появляться неприятный запах от мембраны ионизатора?","answer":"Мембрана изготовлена из материалов, которые не издают запахов. Чаще всего неприятные запахи связаны с химическим составом исходной водой. Например, хлор. Некоторые пользователи бывают очень чувствительны и им ощущается, что мембрана имеет посторонние запахи.","category":"Ионизаторы воды"},{"cell":"D6","question":"Гидроксид -это опасно?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tНет, это не опасно. Это минералы которые находятся в воде. Неорганические соединения, содержащие гидроксильную группу − \"OH\".\n","category":"Гидроксид"},{"cell":"C7","question":"Закройте крышку","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tКрышка не установлена и установлена не правильно. так же может сообщать о проблеме с герконовым датчиком.\n","category":"Ошибки"},{"cell":"B8","question":"Почему уходит вода из стакана при ионизации? что делать?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tМембрана представляет собой микропористую поверхность, способную пропускать только мельчайшие частицы, Эко полимерные. Стакан сделан таким образом чтобы в процессе ионизации ионы могли перемещаться между сосудами, стакан полностью не герметичен! Когда вы наливаете воду в стакан и потом в прибор, вода из стакана никуда не денется под давлением она будет там находиться. Единственный момент в процессе первых 8-10 процессов ионизации на 9.4 пш. вода может немного убывать из стакана примерно на 4 пальца, после эта проблема уйдет.\n","category":"Мембраны"},{"cell":"B6","question":"Как проверить что мембрана вышла из строя","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tКогда мембрана выходит из строя - прибор выдаёт ошибку \"нет воды\".\n","category":"Мембраны"},{"cell":"H14","question":"При крупных пузырьках насыщение водорода хуже, чем при мелких пузырьках?","answer":"Образование крупных пузырьков из-за слияния мелких — это физический процесс, а не обязательно признак плохого насыщения. Для точной оценки насыщения водородом лучше использовать специальные приборы или ориентироваться на заявленные производителем характеристики устройства.\nЕсли были меньше, но стали крупными то просим очистить прибор. А если изначально , то так предусмотренно.","category":"Водородная вода"},{"cell":"C6","question":"Высокая минирелизация","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tПрибор сообщает о том что использована вода с завышенными параметрами по минерализации. Требуется доочистка(фильтрация) воды или отстаивание воды, перед тем как ее запустить в ионизатор.\n","category":"Ошибки"},{"cell":"C5","question":"Нет воды","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tДанная ошибка приводит к тому что:\n1)сообщает что низкая минерализация (требуется подсаливание);\n2)сообщает что пересохла и ее проницаемость снижена( требует ожидание пропитки от 3х до 10 минут, свыше требуется замена);\n3)сообщает что мембрана за кальцинирована при использовании воды повышенной минерализации ( требуется замена).\n","category":"Ошибки"},{"cell":"F20","question":"Как правильно пить воду щелочную, кислотную, серебряную воду?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\t\"Начинать прием внутрь ЩЕЛОЧНОЙ ионизированной воды следует с показателей рН 8.0, повышая на 0.1-0.2 единицы в течение 3-5 дней, постепенно доводя показатель до 9.4. Такая вода считается лечебной, принимать ее следует 3-4 недели за 30 мин до еды и через 60 мин после еды общим объемом 30-40 мл/кг веса. Через 1 месяц приема рекомендуется вернуться к рН 8.5-.8.7 и принимать ее в постоянном режиме. Возвращаться к рН 9.4 рекомендовано при начале ОРВИ, в случае обострения хронических заболеваний или по рекомендации лечащего врача\n \n \nЩелочная вода может быть использована и в качестве наружного средства в виде примочек/компрессов/умывания\n \n \nКислотная вода чаще всего используется наружно в виде протираний, примочек, умываний, спринцеваний, компрессов, полосканий, Далее будут указаны конкретные концентрации и способы применения. Комфортнее пользоваться чуть теплой водой, поэтому рекомендуется ее подогреть до 45 град ДО момента залива в ионизатор. Уже ионизированную воду подогревать нельзя, тк. теряются ее целебные свойства.\n","category":"Щелочная вода"},{"cell":"C10","question":"Почему если установить внутренний стакан, то прибор включается на приготовление водородной воды?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tДанная ошибка связана с проблемой не совпадения магнитиков внутреннее стакана на крылышках и кувшина. А так же с потерей таких магнитиков у внутреннего стакана.\n","category":"Ошибки"},{"cell":"C8","question":"Переставьте стакан","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tПри установке параметров пш от 8.0 до 9.4 пш, внутренний стакан должен быть расположен со стороны темного электрода Анода. с 9.5 пш до 11.0 внутренний стакан устанавливается со стороны светлого электрода у носика кувшина. Соответственно данная ошибка гласит о том что, или не верно установлен стакан или не верно установлен пш.\n","category":"Ошибки"},{"cell":"C11","question":"Отключите вилку от сети?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tСообщает о том что закончил свою работу или прибор так и не был запущен.\n","category":"Ошибки"},{"cell":"D7","question":"Как удалить гидроксид? ( в прибре, сосуде и электроде)","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tПервый способ:Для этого понадобиться периодически по мере появления налета обрабатывать 9% уксусом. Можно смочить ватный диск и методом тампонирования протирать электрод до полного очищения. После обработать влажной тряпкой и удалить остатки уксуса. Второй способ: допускается обернуть электрод хлопковой тканью и смочить 9% уксусом после оставить на 15-30 минут и протереть влажной тряпкой чтобы удалить остатки уксуса. Если требуется процедуру можно повторить. Третий способ: можно залить в кувшин теплую воду из под крана по нижнюю риску и добавить 150 мл 9% уксуса, после закрыть крышку. Оставить на ночь или не меньше чем на 4 ч. После все протереть и промыть для удаление остатков уксуса.\n","category":"Гидроксид"},{"cell":"B9","question":"Внутр. стакан не фиксируется и иногда всплывает, что делать?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tОбязательно сначала налейте воду в стакан, а потом уже залейте воду в кувшин. Так же проверьте правильно ли установлена мембрана.\n","category":"Мембраны"},{"cell":"D5","question":"Почему образуется белый осадок(гидроксид)?","answer":"[Threaded comment]\n Your version of Excel allows you to read this threaded comment; however, any edits to it will get removed if the file is opened in a newer version of Excel. Learn more: https://go.microsoft.com/fwlink/?linkid=870924\nComment:\n\tБелые частицы в только что изготовленной Воде могут свидетельствовать об отложившемся на пластинах гидроксиде. Если ваша вода выглядит мутной, это является хорошим признаком растворения кислорода в ней. Белый налет, это гидроксид, образующийся в процессе ионизации воды. Данный налет появляется на белом электроде и на стенках сосуда, в котором вы храните ионизированную воду. Гидроксид безопасен. Чем выше уровень Ph и чем вода более минерализованная, тем больше выпадет белого осадка. Чтобы избежать появления налета на катоде (светлом электроде), после ионизации промывайте его водой и протирайте салфеткой после каждого приготовления. Если электрод не протирать, то он начнет кальцинироваться, и тогда налет очистить можно будет только 9% уксусом.\nЭто может быть так же связано с низкой минерализацией, однако со временем все равно появится. то есть когда минерализация повышена то и гидроксид сразу появляется, а когда понижена( вода покупная) то и гидроксид появляется после 5-6 приготовлений.\n","category":"Гидроксид"},{"cell":"CHECKLIST2-P1","question":"Что означает показатель ppm в водородной воде?","answer":"ppm — единица измерения концентрации растворённого молекулярного водорода (H₂). В чек-листе AkvaLife концентрация приводится в ppm. Источник: «Чек-лист по приёму ионизированной воды», стр. 2.","category":"Водородная вода"},{"cell":"CHECKLIST2-P2","question":"Изменяется ли pH воды при насыщении молекулярным водородом?","answer":"Согласно чек-листу AkvaLife, при насыщении воды молекулярным водородом её показатель pH не изменяется. Источник: чек-лист, стр. 2.","category":"Водородная вода"},{"cell":"CHECKLIST2-P3","question":"Почему водородную воду рекомендуют употреблять вскоре после приготовления?","answer":"Растворённый молекулярный водород (H₂) постепенно улетучивается. В чек-листе рекомендуется употребить приготовленную водородную воду в первые 20–30 минут. Источник: чек-лист, стр. 2.","category":"Водородная вода"},{"cell":"CHECKLIST2-P4","question":"Можно ли нагревать приготовленную водородную воду?","answer":"В чек-листе AkvaLife указано не кипятить и не нагревать водородную воду выше 40 °C: при нагревании растворённый водород улетучивается. Источник: чек-лист, стр. 3.","category":"Водородная вода"},{"cell":"CHECKLIST2-P5","question":"Как хранить приготовленную кислотную воду?","ans
