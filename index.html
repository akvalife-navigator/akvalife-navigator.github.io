wer":"В чек-листе AkvaLife указано: хранить в стеклянной плотно закрытой таре, в прохладном тёмном месте, избегать прямого ультрафиолетового излучения и не нагревать выше 40–45 °C. Указанный в документе срок использования — 3–5 суток. Источник: чек-лист, стр. 6.","category":"Кислотная вода"},{"cell":"CHECKLIST2-P6","question":"Какие основные показатели характеризуют кислотную воду?","answer":"В чек-листе AkvaLife кислотная вода описывается как вода после электролиза с pH ниже 6 и положительным окислительно-восстановительным потенциалом (ОВП). Источник: чек-лист, стр. 6.","category":"Кислотная вода"},{"cell":"CHECKLIST2-P7","question":"Какие параметры воды меняются при серебрении в ионизаторе AkvaLife?","answer":"Согласно чек-листу AkvaLife, при серебрении целенаправленно изменяется концентрация ионов серебра; показатели pH и ОВП исходной воды не изменяются. Источник: чек-лист, стр. 8.","category":"Серебряная вода"},{"cell":"CHECKLIST2-P8","question":"Какой объём серебряной воды можно приготовить за один цикл?","answer":"Согласно чек-листу AkvaLife, за один цикл можно приготовить 3,5 литра серебряной воды. Источник: чек-лист, стр. 8.","category":"Серебряная вода"},{"cell":"CHECKLIST-SCHEME-P3","question":"Водородная вода: схема применения из чек-листа (стр. 3)","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 3. Текст схемы из документа (не является медицинской рекомендацией сайта).\nРаздел — Как применять\nОсновной режим — 1–4 неделя: постепенный выход на 30 мл/кг в сутки, пить дробно между приёмами пищи\nСтарт — 1 неделя — 15–20 мл/кг (1–2 стакана в день)\nАдаптация — 2 неделя — 25 мл/кг\nБазовый уровень — 3–4 неделя — 30–35 мл/кг\nПри нагрузках — Жара, спорт, баня — 40–50 мл/кг кратковременно\nКак пить — За 20–30 мин до еды или через 40 мин после. Не запивать пищу!\nНагрев — Не кипятить и не нагревать выше 40 °C — водород улетучивается\nХранение — Плотно закрытая тара, без солнца и сильных ЭМ-полей\nКому особенно актуально — Стресс и усталость; активные тренировки; восстановление после нагрузок и ОРВИ; городская экология\nСочетание с щелочной водой — При повышенном давлении — 1 месяц только водородная, затем постепенно добавлять щелочную. В обычном режиме допустимо чередование в течение дня\nПрогнозируемые изменения / Динамика улучшений — 1–2 недели — улучшение гидратации и тонуса; 3–4 недели — более устойчивое восстановление после нагрузок\n* Формула расчета потребления водородной воды аналогична формуле расчета щелочной воды.","category":"Водородная вода"},{"cell":"CHECKLIST-SCHEME-P5","question":"Щелочная вода: схема применения по неделям из чек-листа (стр. 5)","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 5. Текст схемы из документа (не является медицинской рекомендацией сайта).\nНеделя — Рекомендуемый pH — Объём в сутки — Задача этапа\n1 — 8.0–8.2 — 20 мл/кг — мягкая адаптация ЖКТ\n2 — 8.3 — 25 мл/кг — выход на питьевую норму\n3 — 8.4 — 30 мл/кг — базовый режим\n4 — 8.4–8.5 — 30 мл/кг — стабилизация\n5 — 8.5 — 30 мл/кг — основной физиологичный уровень\n6 — 8.5–8.6 — 30 мл/кг — поддержка\n7 — 8.6 — 30 мл/кг — оптимальный диапазон\n8 — 8.6 — 30 мл/кг — закрепление\n9 — 8.6–8.7 — 30 мл/кг — адаптация к нагрузкам\n10 — 8.7 — 30 мл/кг — рабочий максимум\n11 — 8.6 — 30 мл/кг — возврат в базу\n12 и далее — 8.5–8.7 — 30 мл/кг — постоянный режим\n* Формула: суточный объём (мл) = 30 мл × масса тела (кг)\nПример: вес 70 кг: 30 × 70 = 2100 мл/сутки (≈ 2,1 л)\nЕсли жара/спорт/баня: 40 × 70 = 2800 мл (2,8 л); 45 × 70 = 3150 мл (3,15 л); 50 × 70 = 3500 мл (3,5 л).","category":"Щелочная вода"},{"cell":"CHECKLIST-SCHEME-P7","question":"Кислотная вода: схема применения из чек-листа (стр. 7)","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 7. Текст схемы из документа (не является медицинской рекомендацией сайта).\nНаправление — Рекомендуемый pH — Как применять\nКратковременный приём внутрь*\nОтравление, диарея — ~2.5 — 150–200 мл однократно\nБессонница — ~2.6 — 150–200 мл за 20–30 мин до сна\nПолость рта*\nПолоскание после еды — 2.5–3.5 + затем 9.0–9.4 — 60 секунд\nЗапах изо рта — 2.5–3.0 + затем 9.0–9.4 — 20–30 секунд\nУход за дёснами — 3.0–3.5 + затем 9.0–9.4 — 20–30 секунд 1–2 раза в день\nКожа и косметология\nТоник для лица — 4.5–5.5 — протирание утром и вечером\nВоспаления, акне — 2.5–3.0 — точечно 2–3 раза в день\nПосле бритья — 2.5–3.4 — ополаскивание/распыление\nРаздражения кожи — 3.0–4.0 — примочки 5–7 минут\nВолосы\nБлеск и гладкость — 4.0–4.5 — ополаскивание после мытья\nПерхоть — 3.0–3.5 — обработка кожи головы\nЖирность волос — 3.5–4.0 — 2–3 раза в неделю\nЛокальные проблемы\nЯчмень, герпес — ~2.5 — примочки 5–6 раз в день по 5–7 мин\nЗапах ног — 2.5–3.0 — ванночки 10 минут\nМелкие порезы — 2.5–3.0 — промывание","category":"Кислотная вода"},{"cell":"CHECKLIST-SCHEME-P9","question":"Серебряная вода: схема применения из чек-листа (стр. 9)","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 9. Текст схемы из документа (не является медицинской рекомендацией сайта).\nУсловно концентрации делятся на три группы:\nДиапазон — Назначение\n0.01–0.05 мг/л — профилактическое использование, обработка питьевой воды\n0.05–0.5 мг/л — гигиенические и бытовые цели\n0.5–20 мг/л — наружное и местное применение\nДорожная карта применения серебряной воды (AkvaLife)\nКонцентрация Ag+ — Область применения — Режим и особенности\n0.01–0.03 мг/л — Улучшение микробиологического качества питьевой воды — Постоянное использование вместо обычной воды, особенно при сомнительных источниках\n0.03–0.05 мг/л — Профилактическое питьевое применение (период ОРВИ/ОРЗ) — Курсами 7–14 дней по 150–200 мл 1–2 раза в день\n0.05–0.1 мг/л — Полоскание полости рта, гигиена слизистых — 1–2 раза в день, без проглатывания\n0.1–0.2 мг/л — Мытьё фруктов и овощей — Замачивание 10–15 минут\n0.2–0.5 мг/л — Уход за кожей, после бритья, мелкие раздражения — Протирание или примочки\n1–5 мг/л — Дезинфекция посуды, разделочных поверхностей — Замачивание\n1–5 мг/л — Обработка ран, грибковых поражений, гнойничковых заболеваний — Орошение, ванночки, примочки\n5–10 мг/л — Обработка обуви, устранение запахов — Опрыскивание, протирание\n5–10 мг/л — Инфекции ЛОР органов — Промывание, орошение, полоскание. Важно: не глотать\n10–20 мг/л — Санитарная обработка помещений и инвентаря — Только наружное применение","category":"Серебряная вода"},{"cell":"CHECKLIST-SCHEME-P3-TOPIC-1","question":"Каков режим приёма водородной воды по неделям?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 3. Приведено содержание документа, не медицинская рекомендация.\nОсновной режим — 1–4 неделя: постепенный выход на 30 мл/кг в сутки, пить дробно между приёмами пищи\nСтарт — 1 неделя — 15–20 мл/кг (1–2 стакана в день)\nАдаптация — 2 неделя — 25 мл/кг\nБазовый уровень — 3–4 неделя — 30–35 мл/кг\nПри нагрузках — Жара, спорт, баня — 40–50 мл/кг кратковременно","category":"Водородная вода"},{"cell":"CHECKLIST-SCHEME-P3-TOPIC-2","question":"Когда пить, нагревать и как хранить водородную воду по чек-листу?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 3. Приведено содержание документа, не медицинская рекомендация.\nКак пить — За 20–30 мин до еды или через 40 мин после. Не запивать пищу!\nНагрев — Не кипятить и не нагревать выше 40 °C — водород улетучивается\nХранение — Плотно закрытая тара, без солнца и сильных ЭМ-полей","category":"Водородная вода"},{"cell":"CHECKLIST-SCHEME-P3-TOPIC-3","question":"Как в чек-листе описано сочетание водородной и щелочной воды?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 3. Приведено содержание документа, не медицинская рекомендация.\nСочетание с щелочной водой — При повышенном давлении — 1 месяц только водородная, затем постепенно добавлять щелочную. В обычном режиме допустимо чередование в течение дня","category":"Водородная вода"},{"cell":"CHECKLIST-SCHEME-P5-TOPIC-1","question":"Как меняются pH и объём щелочной воды с 1-й по 12-ю неделю?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 5. Текст схемы из документа (не является медицинской рекомендацией сайта).\nНеделя — Рекомендуемый pH — Объём в сутки — Задача этапа\n1 — 8.0–8.2 — 20 мл/кг — мягкая адаптация ЖКТ\n2 — 8.3 — 25 мл/кг — выход на питьевую норму\n3 — 8.4 — 30 мл/кг — базовый режим\n4 — 8.4–8.5 — 30 мл/кг — стабилизация\n5 — 8.5 — 30 мл/кг — основной физиологичный уровень\n6 — 8.5–8.6 — 30 мл/кг — поддержка\n7 — 8.6 — 30 мл/кг — оптимальный диапазон\n8 — 8.6 — 30 мл/кг — закрепление\n9 — 8.6–8.7 — 30 мл/кг — адаптация к нагрузкам\n10 — 8.7 — 30 мл/кг — рабочий максимум\n11 — 8.6 — 30 мл/кг — возврат в базу\n12 и далее — 8.5–8.7 — 30 мл/кг — постоянный режим\n* Формула: суточный объём (мл) = 30 мл × масса тела (кг)\nПример: вес 70 кг: 30 × 70 = 2100 мл/сутки (≈ 2,1 л)\nЕсли жара/спорт/баня: 40 × 70 = 2800 мл (2,8 л); 45 × 70 = 3150 мл (3,15 л); 50 × 70 = 3500 мл (3,5 л).","category":"Щелочная вода"},{"cell":"CHECKLIST-SCHEME-P7-TOPIC-1","question":"Какие способы наружного применения кислотной воды указаны в чек-листе?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 7. Приведено содержание документа, не медицинская рекомендация.\nПолость рта*\nПолоскание после еды — 2.5–3.5 + затем 9.0–9.4 — 60 секунд\nЗапах изо рта — 2.5–3.0 + затем 9.0–9.4 — 20–30 секунд\nУход за дёснами — 3.0–3.5 + затем 9.0–9.4 — 20–30 секунд 1–2 раза в день\nКожа и косметология\nТоник для лица — 4.5–5.5 — протирание утром и вечером\nВоспаления, акне — 2.5–3.0 — точечно 2–3 раза в день\nПосле бритья — 2.5–3.4 — ополаскивание/распыление\nРаздражения кожи — 3.0–4.0 — примочки 5–7 минут\nВолосы\nБлеск и гладкость — 4.0–4.5 — ополаскивание после мытья\nПерхоть — 3.0–3.5 — обработка кожи головы\nЖирность волос — 3.5–4.0 — 2–3 раза в неделю\nЛокальные проблемы\nЯчмень, герпес — ~2.5 — примочки 5–6 раз в день по 5–7 мин\nЗапах ног — 2.5–3.0 — ванночки 10 минут\nМелкие порезы — 2.5–3.0 — промывание","category":"Кислотная вода"},{"cell":"CHECKLIST-SCHEME-P9-TOPIC-1","question":"Какие диапазоны концентрации серебра указаны в чек-листе?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 9. Приведено содержание документа, не медицинская рекомендация.\nУсловно концентрации делятся на три группы:\nДиапазон — Назначение\n0.01–0.05 мг/л — профилактическое использование, обработка питьевой воды\n0.05–0.5 мг/л — гигиенические и бытовые цели\n0.5–20 мг/л — наружное и местное применение","category":"Серебряная вода"},{"cell":"CHECKLIST-SCHEME-P9-TOPIC-2","question":"Как в чек-листе описаны бытовые способы применения серебряной воды?","answer":"Источник: «Чек-лист по приёму ионизированной воды», стр. 9. Приведено содержание документа, не медицинская рекомендация.\n0.1–0.2 мг/л — Мытьё фруктов и овощей — Замачивание 10–15 минут\n0.2–0.5 мг/л — Уход за кожей, после бритья, мелкие раздражения — Протирание или примочки\n1–5 мг/л — Дезинфекция посуды, разделочных поверхностей — Замачивание\n1–5 мг/л — Обработка ран, грибковых поражений, гнойничковых заболеваний — Орошение, ванночки, примочки\n5–10 мг/л — Обработка обуви, устранение запахов — Опрыскивание, протирание\n5–10 мг/л — Инфекции ЛОР органов — Промывание, орошение, полоскание. Важно: не глотать\n10–20 мг/л — Санитарная обработка помещений и инвентаря — Только наружное применение","category":"Серебряная вода"},{"cell":"Чек-лист, стр. 6","question":"Как правильно хранить кислотную воду?","answer":"Хранение кислотной воды:\n1. Использовать в течение 3–5 суток.\n2. Хранить в стеклянной, плотно закрытой таре.\n3. Избегать прямого воздействия ультрафиолета и источников электромагнитного излучения.\n4. Хранить в прохладном, тёмном месте.\n5. Не нагревать выше 40–45 °C.","category":"Кислотная вода"},{"cell":"RESTORED-2026-11-06-01","question":"Какие показания к применению аппарата НЕЙРОДЭНС-ПКМ?","answer":"НЕЙРОДЭНС-ПКМ — медицинское изделие для динамической электронейростимуляции. Согласно руководству производителя, показания включают:\n— Острые и хронические болевые синдромы (в том числе головная, зубная, послеоперационная боль, боль в спине, шее и суставах).\n— Травмы и реабилитацию после травм, операций и заболеваний.\n— Заболевания органов дыхания (кашель, затруднение дыхания).\n— Нарушения работы желудочно-кишечного тракта (боль в животе, изжога, тошнота, вздутие, запор, диарея).\n— Заболевания ЛОР-органов (заложенность носа, боль в горле, осиплость).\n— Артериальную гипертензию и гипотонию.\n— Заболевания мышц, суставов, связок и позвоночника.\n— Заболевания нервной системы (головная боль, головокружение, мигрень, нарушения сна).\n— Заболевания мочеполовой системы, в том числе болезненные менструации и нарушения мочеиспускания.\n— Некоторые кожные реакции (крапивница, аллергические реакции, укусы насекомых).\n— Физическое и умственное переутомление, нарушения сна.\n\nВ руководстве указано применение с периода новорождённости; конкретные программы имеют возрастные ограничения. Имеются противопоказания. Применять по инструкции и рекомендациям врача.\nИсточник: ООО «ТРОНИТЕК», руководство НЕЙРОДЭНС-ПКМ, ТРТК 20.0-03-70-03 РЭ, раздел 1.2.1.","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-02","question":"Какие показания к применению аппарата НЕЙРОДЭНС-Аксон?","answer":"НЕЙРОДЭНС-Аксон — медицинское изделие для чрескожной противоболевой электростимуляции. Согласно руководству производителя, показания к применению:\n— Острая и хроническая боль, связанная с патологией внутренних органов.\n— Острая и хроническая боль, связанная с заболеваниями и травмами опорно-двигательного аппарата.\n\nИмеются противопоказания. Перед применением необходимо ознакомиться с инструкцией и при необходимости проконсультироваться с врачом.\nИсточник: ООО «ТРОНИТЕК», руководство НЕЙРОДЭНС-АКСОН, ТРТК 31.0-03.70-02 РЭ, раздел 2.","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-03","question":"Какие противопоказания у аппарата НЕЙРОДЭНС-ПКМ?","answer":"НЕЙРОДЭНС-ПКМ — медицинское изделие для динамической электронейростимуляции.\n\nАбсолютные противопоказания:\n— Наличие имплантированного кардиостимулятора.\n— Индивидуальная непереносимость электрического тока.\n\nОтносительные противопоказания:\n— Эпилептический статус.\n— Воздействие непосредственно в области новообразований любой этиологии.\n— Лихорадка неясного происхождения.\n— Тромбоз вен.\n— Состояние острого психического, алкогольного или наркотического возбуждения.\n\nПри наличии относительных противопоказаний необходимо проконсультироваться с лечащим врачом.","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-04","question":"Какие противопоказания у аппарата НЕЙРОДЭНС-Аксон?","answer":"По предоставленным данным, для НЕЙРОДЭНС-Аксон указаны следующие противопоказания.\n\nАбсолютные противопоказания:\n— Наличие имплантированного кардиостимулятора.\n— Индивидуальная непереносимость электрического тока.\n\nОтносительные противопоказания:\n— Эпилептический статус.\n— Воздействие непосредственно в области новообразований любой этиологии.\n— Лихорадка неясного происхождения.\n— Тромбоз вен.\n— Состояние острого психического, алкогольного или наркотического возбуждения.\n\nПри наличии относительных противопоказаний необходимо проконсультироваться с лечащим врачом.","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-05","question":"Какой гарантийный срок у аппарата НЕЙРОДЭНС-ПКМ?","answer":"Гарантийный срок на аппарат НЕЙРОДЭНС-ПКМ составляет 1 год.","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-06","question":"Какой гарантийный срок у аппарата НЕЙРОДЭНС-Аксон?","answer":"Гарантийный срок на аппарат НЕЙРОДЭНС-Аксон составляет 1 год.","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-07","question":"Какой ресурс у генератора водородной воды Лайт (ГВВЛ)?","answer":"Ресурс генератора водородной воды Лайт (ГВВЛ) составляет 6000 часов (ориентировочно около 6 лет в зависимости от частоты использования).","category":"ГВВ "},{"cell":"RESTORED-2026-11-06-08","question":"Какой гарантийный срок у генератора водородной воды Лайт (ГВВЛ)?","answer":"Гарантийный срок генератора водородной воды Лайт (ГВВЛ) составляет 1 год.","category":"ГВВ "},{"cell":"RESTORED-2026-11-06-09","question":"Какой ресурс у генератора водородной воды Премиум (ГВВП)?","answer":"Ресурс генератора водородной воды Премиум (ГВВП) составляет 8000 часов (ориентировочно около 8 лет в зависимости от частоты использования).","category":"ГВВ "},{"cell":"RESTORED-2026-11-06-10","question":"Какой гарантийный срок у генератора водородной воды Премиум (ГВВП)?","answer":"Гарантийный срок генератора водородной воды Премиум (ГВВП) составляет 1 год.","category":"ГВВ "},{"cell":"RESTORED-2026-11-06-11","question":"Какой ресурс у генератора водородной воды — увлажнителя для лица и тела (ГВВУ)?","answer":"Ресурс генератора водородной воды — увлажнителя для лица и тела (ГВВУ) составляет 6000 часов.","category":"ГВВ "},{"cell":"RESTORED-2026-11-06-12","question":"Какой гарантийный срок у генератора водородной воды — увлажнителя для лица и тела (ГВВУ)?","answer":"Гарантийный срок генератора водородной воды — увлажнителя для лица и тела (ГВВУ) составляет 1 год.","category":"ГВВ "},{"cell":"RESTORED-2026-11-06-13","question":"Для чего нужен режим МЭД в аппарате НЕЙРОДЭНС-ПКМ?","answer":"МЭД — это «минимальная эффективная доза». Режим предназначен для воздействия на биологически активные точки и зоны с автоматическим подбором продолжительности стимуляции с учётом индивидуальной реакции организма.\n\nВ пособии по применению НЕЙРОДЭНС-ПКМ указано использование режима:\n— При физическом и умственном переутомлении.\n— При синдроме хронической усталости.\n— При метеочувствительности.\n— Для профилактики в период сезонного подъёма респираторных заболеваний.\n— Для поддержки адаптационных возможностей организма при стрессовых нагрузках.\n\nПрограмма состоит из двух этапов:\n1. ТЕСТ — аппарат оценивает электрические характеристики кожи и автоматически определяет продолжительность первой фазы воздействия.\n2. ТЕРАПИЯ — электростимуляция в течение 5 минут с частотой 10 Гц.\n\nМощность воздействия устанавливается индивидуально. Режим применяется в соответствии с инструкцией и с учётом противопоказаний.\nИсточник: пособие по применению НЕЙРОДЭНС-ПКМ, раздел 2.1.3 «Программа МЭД».","category":"Тронитек"},{"cell":"RESTORED-2026-11-06-14","question":"Можно ли повысить pH воды с помощью обычной пищевой соды?","answer":"Аббревиатура pH переводится как pondus Hydrogenium, то есть  определённый рН можно получить только с нахождением в воде водорода с другими соединениями.\nДобавив соду будет просто растров воды с содой (гидрокарбонат натрия)","category":"Щелочная вода"}];

 function prodCard(p){const f=linkedFAQ(p);return `<details class="panel ency-item"><summary>${esc(p.name)}</summary><p>${esc(p.description)}</p>${Object.keys(p.specs).length?`<h4>Характеристики и комплектация</h4><table class="ency-spec">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`:''}${p.usage?`<h4>Использование</h4><p>${esc(p.usage)}</p>`:''}<p class="ency-source">Источник: <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">официальная страница AkvaLife</a></p>${f.length?`<h4>Связанные вопросы из Excel (${f.length})</h4>${f.map(faqCard).join('')}`:''}</details>`}
 function kbCard(c){return `<details class="panel ency-item"><summary>${esc(c.category)} — ${esc(c.topic)}</summary><div class="ency-answer">${esc(c.description)}</div>${c.purpose?`<p>${esc(c.purpose)}</p>`:''}${kbList('Характеристики',c.characteristics)}${kbList('Функции и режимы',c.functions_modes)}${kbList('Расходники',c.consumables)}${kbList('Примечания',c.notes)}</details>`}
 function draw(){const q=norm(search.value.trim());nav.innerHTML=tabs.map(t=>`<button type="button" data-tab="${esc(t)}" class="${t===active?'active':''}">${esc(t)}${cats.includes(t)?' ('+faq.filter(x=>x.category===t).length+')':''}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;draw()});const matching=faq.filter(x=>(active==='Все вопросы и ответы'||active==='Каталог товаров'||active==='Продукция и характеристики'||x.category===active)&&norm(x.question+' '+x.answer+' '+x.category).includes(q));const pp=products.filter(p=>norm([p.name,p.description,JSON.stringify(p.specs),p.tags].join(' ')).includes(q));let h=`<h3 class="ency-head">${esc(active)}</h3>`;if(active==='Каталог товаров'){h+=pp.map(prodCard).join('')||'<p>Товары не найдены.</p>';if(q)h+=`<h4>Совпадения в FAQ</h4>`+matching.map(faqCard).join('')}else if(active==='Продукция и характеристики'){h+=AKVALIFE_KB.cards.filter(c=>norm(JSON.stringify(c)).includes(q)).map(kbCard).join('')}else{h+=matching.map(faqCard).join('')||'<p>Вопросы не найдены.</p>'}out.innerHTML=h}
 out.addEventListener('click',e=>{const b=e.target.closest('[data-ency-copy]');if(b){const item=faq[Number(b.dataset.encyCopy)];if(item)copyText(item.answer);}});
 search.addEventListener('input',draw);draw();
}
function renderReturns(box){
  box.innerHTML=moduleHeader("Возврат / ремонт / трейд-ин","Как принять и оформить обращение: возврат, гарантийная и негарантийная диагностика, трейд-ин.")+`<div class="panel" style="padding:0;overflow:hidden"><iframe id="returnsFrame" title="Возврат ремонт трейд-ин" style="width:100%;height:78vh;border:0;background:#fff"></iframe></div>`;
  const html=new TextDecoder().decode(Uint8Array.from(atob(RETURNS_BASE_B64),c=>c.charCodeAt(0)));
  document.getElementById("returnsFrame").srcdoc=html;
}
function renderRepair(box){
  box.innerHTML=moduleHeader("Ремонтные вопросы / проблемы","Готовая техническая база: Ионизаторы, НЕЙРОДЭНС, ГВВ, Увлажнители и памятка оператору.")+`<div class="panel" style="padding:0;overflow:hidden"><iframe id="repairFrame" title="Ремонтные вопросы и проблемы" style="width:100%;height:78vh;border:0;background:#fff"></iframe></div>`;
  const html=new TextDecoder().decode(Uint8Array.from(atob(REPAIR_BASE_B64),c=>c.charCodeAt(0)));
  document.getElementById("repairFrame").srcdoc=html;
}
</script>
