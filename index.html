const objectionLibrary = {"title":"Библиотека возражений — «275 готовых ответов на возражения»","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"},"description":"Структурированная база возражений и готовых ответов для модуля «Работа с возражениями».","rules":["Показывать только возражения из этой базы.","Не генерировать новые варианты ответа внутри модуля.","Для каждого ответа сохранять страницу источника.","Если поле не подтверждается источником, оставлять его пустым."],"stats":{"objections":87,"answers":275,"categories":8},"items":[{"category":"Цена","stage":"Обсуждение стоимости","objection":"У Вас дорого!","keywords":["дорого"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, я назвал примерную цену. А вообще по цене могут быть варианты разные, в зависимости от наполнения / комплектации. Например, есть такой вариант (презентуем альтернативы)","source_page":"7"},{"text":"ИО, «дорого» по сравнению с другими аналогичными предложениями или вообще за эту услугу?","source_page":"7"},{"text":"Цена – вопрос важный. При этом не самый главный, т.к. по цене мы с клиентами почти всегда договариваемся. Скажите, в целом Вам продукт / решение подходит?","source_page":"7"},{"text":"Цену устанавливает производитель / разработчик. Поэтому она не будет существенно отличаться у других продавцов. Или для Вас такая цена в принципе высокая и нужно рассмотреть другие варианты?","source_page":"7"},{"text":"ИО, конечно, такая услуга в такой комплектации стоит денег. При этом, чтобы Вы понимали, за что именно Вы платите, смотрите (кратко презентуем наполнение и результаты). Как видите, то, что Вы получите в итоге перекрывает инвестиции","source_page":"7"},{"text":"Сейчас, возможно, есть единоразовая трата. Но давайте посчитаем, сколько получится сэкономить за год? А за три? Если сотрудники будут работать без четкой системы, сколько можете потерять?","source_page":"7"},{"text":"ИО, в нашей ситуации, наверное, главный вопрос не «Сколько стоит», а «Стоит ли это того?». Давайте еще раз посмотрим, как быстро это должно окупиться","source_page":"7"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Это высокая цена. В рекламе была меньше!","keywords":["высокая","цена","рекламе","меньше"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Действительно, цена в рекламе является базовой, и некоторые клиенты приобретают наш продукт именно за такую цену. Тут важно определиться по функционалу, что Вам действительно нужно. И насколько базовый комплект Вам подходит. Скажите, как…","source_page":"8"},{"text":"Да, такой вариант тоже есть / возможен. Как правило, мы с клиентами обсуждаем различные варианты и выбираем уже тот, который клиенту удобнее и (в итоге) выгоднее","source_page":"8"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Нет денег","keywords":["денег"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Нет денег в этом месяце или вообще пока не видите смысла покупать этот продукт?","source_page":"8"},{"text":"Вопрос с оплатой мы с клиентами обычно решаем, договариваемся. Сейчас важно понять, нужна ли Вам вообще эта услуга или пока нет?","source_page":"8"},{"text":"Да, сейчас такое время)) Давайте определимся, а нужен ли Вам этот продукт вообще","source_page":"8"},{"text":"ИО, а вообще деньги в этом направлении периодически выделяете (на рекламу, на обучение сотрудников и т.д.)? В таком случае мы можем так поступить: сделать пилотный проект и оценить, насколько работа с нами будет выгодна, сколько Вы сможете заработать, сэкономить? А потом будем принимать решение","source_page":"8"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"У Вас подозрительно дешево","keywords":["подозрительно","дешево"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, после первых сделок наши клиенты обычно говорят: «Спасибо! А мы думали такой продукт стоит гораздо дороже!». Мы знаем, как выстроить процесс, чтобы избавить Вас о ненужных переплат. При этом у нас есть гарантия, и Вы можете быть уверены в…","source_page":"9"},{"text":"Вы правильно заметили, что наши цены ниже среднерыночных и вот почему: (большие корпоративные скидки, прямые поставки, надежные партнеры и т.д..)","source_page":"9"},{"text":"А какая цена была бы для Вас оптимальной? Уверен, тут я смогу договориться со своим руководством))","source_page":"9"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"У Вас нет отсрочки платежа","keywords":["отсрочки","платежа"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Действительно, базовые условия ее не предполагают. Скажите, насколько для Вас это принципиальный момент?","source_page":"9"},{"text":"Чем именно Вам это не удобно? Какую отсрочку Вы бы сами хотели?","source_page":"9"},{"text":"Мы готовы сделать Вам отсрочку, при условии (большого заказа, либо своевременной оплаты 3 заказов и т.д.), готовы так работать?","source_page":"9"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Я не готов платить до оказания услуги / поставки продукта","keywords":["готов","платить","оказания","услуги","поставки","продукта"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Вы рассматриваете оплату после поставки, потому что сейчас нет возможности сделать предоплату или потому что хотите сначала убедиться, что товар качественный, и сразу после этого оплатить?","source_page":"10"},{"text":"Понимаю, что важно подобрать комфортную форму расчета. Почему для Вас именно постоплата важна?","source_page":"10"},{"text":"Мы знаем, что постоплата удобна многим нашим клиентам, поэтому работаем в таком формате после первых 3-х заказов. Это предусмотрено у нас программой лояльности. Давайте сделаем расчет...","source_page":"10"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Дайте мне скидку 20%","keywords":["дайте","скидку"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Мы можем обсуждать индивидуальные условия в каждом проекте. Давайте посмотрим, за счет чего можно снизить стоимость в нашей ситуации (смотрим наполнение, показываем ценность и обоснованность цены. Часто клиенты передумывают просить скидку и покупают по полной цене)","source_page":"10"},{"text":"Почему именно 20%? У Вас есть жесткий бюджет или Вы ориентируетесь на какой-то вариант конкурентов?","source_page":"10"},{"text":"У Вас есть жесткое ограничение по бюджету? Давайте посмотрим другие тарифы, чтобы выбрать лучший вариант в рамках существующего бюджета, хорошо?","source_page":"10"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Я буду искать более низкую цену на рынке","keywords":["буду","искать","более","низкую","цену","рынке"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понимаю. По цене на рынке есть много предложений. А что для Вас важно при выборе этого продукта помимо цены?","source_page":"11"},{"text":"У Вас есть какой-то строгий бюджет или Вы планируете в целом оценить рынок и найти более выгодный вариант?","source_page":"11"},{"text":"Если составить список из 3-х важнейших для Вас критериев при покупке этого продукта, в эту тройку точно войдет цена, правильно понимаю? И что еще, кроме цены?","source_page":"11"},{"text":"Сориентируйте, а в какие сроки Вам важно, чтобы все было готово (установлено, настроено, работало на Вас)? Уже смотрели какие-то варианты по цене? Какие там плюсы / минусы?","source_page":"11"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Подожду, пока у Вас будет акция","keywords":["подожду","пока","акция"],"client_phrase":"","hidden_reason":"","answers":[{"text":"То есть Вы уже точно понимаете, что именно этот вариант подходит лучше всего, и хочется дождаться более выгодных условий? Сейчас я расскажу, как можно получить бонусы / подарки сегодня...","source_page":"11"},{"text":"Акции у нас бывают, при этом довольно редко. А почему для Вас важно акции дождаться? Часто бывает, что клиентам выгоднее уже сейчас купить и начать пользоваться, чем ждать акций и терять время. Вы когда планируете начать использовать?","source_page":"11"},{"text":"Иногда у нас бывают акции, которые позволяют получить дополнительные бонусы, подарки или небольшие скидки. Вы хотели бы скидку или бонус получить?","source_page":"11"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"Я рассчитывал на более низкую цену","keywords":["рассчитывал","более","низкую","цену"],"client_phrase":"","hidden_reason":"","answers":[{"text":"У Вас есть жесткий бюджет, в который нужно уложиться, или просто рассчитывали, что такие услуги должны стоить дешевле?","source_page":"12"},{"text":"Вы уже смотрели аналогичные варианты по ценам, функционалу? Какие преимущества видите в нашем предложении?","source_page":"12"},{"text":"По цене у нас есть несколько вариантов. Давайте обсудим их через пару минут. А сейчас по функционалу / наполнению – скажите, это то, что Вам нужно?","source_page":"12"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Цена","stage":"Обсуждение стоимости","objection":"А скидки есть какие-нибудь?","keywords":["скидки","нибудь"],"client_phrase":"","hidden_reason":"","answers":[{"text":"У нас есть система лояльности, которая предусматривает бонусы, подарки и скидки при определенных условиях. Например, на каждый второй заказ мы предоставляем...","source_page":"12"},{"text":"Да, у нас есть скидки при определенных условиях: например, полная предоплата в течение 2 дней или заказ 3-х и более услуг. Скажите, пожалуйста, у Вас бывают в бизнесе... (перечисляем ситуации, в которых могут быть нужны наши доп. услуги. Повышаем средний чек)","source_page":"12"},{"text":"Данный продукт является премиальным, поэтому скидок на него не предоставляем. Наоборот – цены периодически повышаются. Давайте оценим, насколько это окупается и выгодно для Вас на текущих условиях?","source_page":"12"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"У Вас очень неудобные сроки поставки (функционал и т.д.)","keywords":["неудобные","сроки","поставки","функционал"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Расскажите, какие сроки были бы для Вас приемлемы? Подумаем, что можно сделать","source_page":"14"},{"text":"Скажите, в чем именно для Вас неудобство наших сроков? Давайте попробуем построить работу так, чтобы решить этот вопрос","source_page":"14"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Вашу программу / услугу слишком долго настраивать","keywords":["вашу","программу","услугу","слишком","долго","настраивать"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Настройка и интеграция действительно очень важны. Поэтому мы продумали ее до мельчайших шагов. Скажите, в какие сроки хотели бы уложиться? Подумаем, что можно сделать","source_page":"14"},{"text":"Скажите, если обучение и интеграцию мы полностью возьмем на себя, от Вас только принципиальное согласие, так подойдет?","source_page":"14"},{"text":"Другими словами, Вас смущает технический момент, связанный с интеграцией. Это единственное, что останавливает?","source_page":"14"},{"text":"Скажите, Вас тут что больше смущает, собственные усилия или время на интеграцию? Тут фактически все зависит от нас с Вами, насколько мы точно оценим ресурсы на старте и договоримся. И хорошо, что мы это сейчас можем с Вами открыто обсуждать. Давайте посмотрим наше предложение по настройке","source_page":"14"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Ваш продукт нам не подходит (нужен другой формат, функционал)","keywords":["продукт","подходит","нужен","другой","формат","функционал"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понял, а какой для Вас идеальный вариант? У нас есть разные варианты комплектации / наполнения, поэтому мы можем подобрать тот вариант, который подойдет именно Вам","source_page":"15"},{"text":"Расскажите, пожалуйста, какой формат или функционал Вам нужен? Возможно, у нас получится максимально адаптировать под Вас этот продукт или подобрать альтернативу","source_page":"15"},{"text":"Вы имеете в виду, что функционал избыточный для Вашей ситуации, или наоборот, чего-то не хватает?","source_page":"15"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Ваш продукт быстро устаревает, мне нужно все новое!","keywords":["продукт","быстро","устаревает","новое"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Сейчас рынок меняется очень быстро, согласен с Вами. Именно поэтому у нас есть регулярные обновления продукта. Смотрите, как это выглядит...","source_page":"15"},{"text":"Согласен, что в этой сфере все очень быстро меняется. Поэтому наш продукт создан так, чтобы долгое время выполнять главные задачи и давать вам результат. Я же правильно понимаю, что текущая версия продукта решает Ваши задачи?","source_page":"15"},{"text":"Хорошо, что Вы следите за новинками. Наш продукт действительно может не быть последней моделью через год, но мы гарантируем его актуальность и эффективность на протяжении всего срока службы. У нас предусмотрены регулярные обновления, вот пример...","source_page":"15"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Ваше оборудование очень дорогое в обслуживании","keywords":["ваше","оборудование","дорогое","обслуживании"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Я понимаю, насколько важно, чтобы оборудование работало бесперебойно, без простоев. Именно поэтому мы особое внимание уделяем обслуживанию, регулярным проверкам и быстрому устранению любых проблем. Именно такое обслуживание дает максимальную окупаемость в короткие сроки. Давайте посчитаем..","source_page":"16"},{"text":"Вы сравниваете с каким-то конкретным оборудованием или в целом рассчитывали на меньшую стоимость обслуживания?","source_page":"16"},{"text":"Да, обслуживание стоит денег, при этом стоимость обслуживания составляет всего несколько процентов от стоимости самого оборудования, и самое главное – за счет грамотного обслуживания оборудование окупается за счет долговечности и стабильной работы. В итоге это приносит гораздо больше денег","source_page":"16"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Я не чувствую, что Ваше предложение – лучшее для меня","keywords":["чувствую","ваше","предложение","лучшее"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понятно, что хочется выбрать самое выгодное. А что именно вызывает сомнения? Давайте посмотрим, что можно сделать лучше","source_page":"16"},{"text":"Если по 10-балльной шкале оценить наше предложение, сколько бы Вы поставили? Почему именно такой балл? Что больше всего нравится и что хотели бы улучшить?","source_page":"16"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Ваш продукт не учитывает нашу специфику","keywords":["продукт","учитывает","нашу","специфику"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Согласен, что в каждом проекте есть специфика. Поэтому у нас есть опыт адаптации нашего продукта под разные задачи. Расскажите, какая у Вас специфика, и мы найдем решение","source_page":"17"},{"text":"Вы имеете в виду региональную специфику, отраслевую или ...? Расскажите, пожалуйста, это важный момент – мы всегда учитываем специфику каждого проекта, так как это прямо влияет на результат","source_page":"17"},{"text":"Мы знаем, насколько важно учитывать специфику в каждом проекте. Поэтому наша работа начинается с анализа Вашей ситуации. У нас есть отраслевой опросник для выявления всех нюансов, который помогает грамотно выстроить работу. Кстати, из Вашей отрасли у нас также есть кейсы. Хотите посмотреть?","source_page":"17"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Свойства продукта","stage":"Обсуждение продукта","objection":"Мне не нравится Ваш функционал / дизайн / материалы / состав","keywords":["нравится","функционал","дизайн","материалы","состав"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, понял, дизайн / доп. функционал можем обсудить отдельно, это решаемый вопрос. Главное понять, а в целом этот продукт решает Ваши главные задачи?","source_page":"17"},{"text":"Скажите, а что бы Вы хотели увидеть в идеале? Есть примеры, как это может выглядеть?","source_page":"17"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Нам неинтересно, не актуально","keywords":["неинтересно","актуально"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Вам это не нужно сейчас, или Вы вообще не пользуетесь такими услугами?","source_page":"19"},{"text":"Вы уже все купили, или у Вас израсходован бюджет? Вы имеете в виду, что работаете уже с другими или сейчас у Вас несезон?…","source_page":"19"},{"text":"Возможно, Вам ничего не нужно сейчас, при этом, учитывая, что Ваша компания постоянно развивается и растет, наше предложение может быть очень актуально уже в ближайшее время. Скажите, у Вас бывает такое (вопрос по ситуации клиента с целью вовлечения)?","source_page":"19"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Нам ничего не нужно","keywords":["ничего"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Не нужно, потому что уже работаете с другими или потому что вообще не пользуетесь такими услугами?","source_page":"19"},{"text":"Не нужно именно сейчас или вообще не планируете развивать это направление?","source_page":"19"},{"text":"Скажите, а у Вас бывают такие ситуации, когда [проблема]?","source_page":"19"},{"text":"Я согласен, что если нет выгоды, то нет и смысла пользоваться сервисом / продуктом. ИО, я же правильно понимаю, что у Вас есть менеджеры в отделе продаж? По нашему опыту, менеджеры начинают продавать больше при использовании скриптов продаж. Я хотел показать Вам варианты скриптов для Вашей ситуации. Когда будет удобно обсудить?","source_page":"19"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Я не пользуюсь этим принципиально","keywords":["пользуюсь","принципиально"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Вы имеете ввиду нашу компанию, или Вы вообще не пользуетесь такими услугами?","source_page":"20"},{"text":"ИО, скажите, пожалуйста, не нужно, потому то Вы этим вообще не пользуетесь или потому что работаете с другими поставщиками?","source_page":"20"},{"text":"ИО, а Вы пробовали раньше пользоваться этим? Как результаты?","source_page":"20"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Мы уже пробовали. Не понравилось.","keywords":["пробовали","понравилось"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Не понравилась работа поставщика или сам продукт не дал нужного эффекта?","source_page":"20"},{"text":"О! А что случилось? Можете рассказать подробности? А если бы не этот момент, в остальном Вам как?","source_page":"20"},{"text":"Скажите, а как давно это было? Для чего покупали, какие задачи были?","source_page":"20"},{"text":"Знаете, по опыту, внедрение чего-то нового редко на старте делает всех довольными и счастливыми. Понятно, что это проект, с планируемыми преимуществами и выгодой, но, как правило, через какое-то время. Давайте попробуем прояснить, где в прошлый раз возникли сложности и как заранее обойти этот момент","source_page":"20"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Мне уже предлагали это . Я отказался (по телефону)","keywords":["предлагали","отказался","телефону"],"client_phrase":"","hidden_reason":"","answers":[{"text":"А для чего рассматривали покупку? Почему решили отказаться? Смотрите, время идет, ситуация меняется, продукт сам по себе тоже реагирует на рынок. Я предлагаю обсудить детали и оценить, насколько в текущей ситуации это может Вам подойти","source_page":"21"},{"text":"ИО, понимаю, что Вы уже рассматривали ранее такую услугу. При этом многое уже поменялось. Причем в лучшую сторону. Смотрите, какие появились возможности","source_page":"21"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Я лучше сделаю это своими силами (сайт, обучение сотрудников, ! настройка crm и т.д.)","keywords":["лучше","сделаю","своими","силами","сайт","обучение","сотрудников","настройка"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, понятно, что многое можно сделать самому, погрузившись в тему, изучив и разобравшись, как это делается. Попробовав раз-два, с третьего-то что-то выйдет. Вопрос в другом, сколько времени это займет, и какие есть риски?","source_page":"21"},{"text":"Хорошо, ИО, когда планируете этим заняться? Спрашиваю, потому что, как говорится, время – деньги. Может быть, с нами Вы сделаете быстрее и уже через месяц получите первые результаты. Давайте посчитаем?","source_page":"21"},{"text":"ИО, кстати, Ваш вклад здесь в любом случае нужен, даже если Вы закажете услугу у нас. Смотрите, как выглядит процесс и какие моменты важно учесть.","source_page":"21"},{"text":"“Лучше своими силами?” А почему лучше? Это качественнее, быстрее? Или вопрос в цене?","source_page":"21"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Сейчас кризис, надо экономить и затянуть пояса, ! не покупать лишнего..","keywords":["кризис","надо","экономить","затянуть","пояса","покупать","лишнего"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Согласен, ИО, что кризис лучше переждать. Особенно если знать, когда и чем он закончится ☺. А учитывая, что мы этого не знаем, давайте посмотрим, как в условиях кризиса можно улучшить процессы благодаря нашему продукту…","source_page":"22"},{"text":"ИО, есть мнение, что кризис лучше переждать не высовываясь, в режиме максимального сохранения энергии. Если бы только знать точно, когда он закончится. А поскольку мы с Вами не знаем, когда он закончится и чем закончится, важно принимать взвешенные решения","source_page":"22"},{"text":"Насчет экономии согласен с Вами. Именно это я и хотел обсудить, так как по нашему опыту внедрив продукт / сервис, Вы будете экономить 20% расходов на рекламу. Какой у Вас примерный бюджет на рекламу?","source_page":"22"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Когда будет нужно – сам обращусь к Вам","keywords":["обращусь"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, скажите, а сейчас как решаете эту [проблему]?","source_page":"22"},{"text":"ИО, хорошо, отметил себе. Кстати, чтобы у Вас было представление, что это даст в Вашей ситуации и сколько может стоить, давайте сделаем [бесплатный первый шаг]","source_page":"22"},{"text":"А вообще у Вас бывают сейчас такие ситуации, когда [ситуация, в которой возникает потребность в Вашем продукте]...?","source_page":"22"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Мы решим эту задачу другим способом, без Вашего продукта","keywords":["решим","задачу","другим","способом","вашего","продукта"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Вы имеете в виду \"своими силами\" или \"с другой компанией\"? Да, есть разные способы решения, давайте оценим плюсы и минусы каждого...","source_page":"23"},{"text":"Понимаю. Клиенты часто рассматривают минимум 3 варианта решения, поэтому я подготовил сравнительную таблицу с нюансами. Давайте посмотрим...","source_page":"23"},{"text":"А почему решили рассматривать альтернативы? Как Вам наш продукт по функционалу? По цене?","source_page":"23"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"В моей ситуации это не сработает! !","keywords":["моей","ситуации","сработает"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Я понимаю, что есть сомнения. А какие нюансы видите именно в Вашей ситуации? Что важно учесть, чтобы все сработало, на Ваш взгляд?","source_page":"23"},{"text":"А какое идеальное решение видите с учетом Вашего опыта и специфики ситуации?","source_page":"23"},{"text":"У нас были случаи, когда люди думали так же при обсуждении условий проекта. При этом, когда мы разработали детальный план проекта, мы согласовали все детали и успешно реализовали проект","source_page":"23"},{"text":"Чтобы все прошло успешно, очень важен Ваш настрой. Я дам Вам контакты наших клиентов из такой же сферы – обсудите с ними, как это сработало. И если Ваш настрой изменится – согласуем детали проекта. Как считаете?","source_page":"23"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Отсутствие потребности","stage":"Выявление потребности","objection":"Спасибо, я просто смотрю! Покупать пока не планирую","keywords":["спасибо","смотрю","покупать","пока","планирую"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, пожалуйста. У нас есть бесплатный каталог с обзором всей продукции / услуг для разных ситуаций, выслать Вам в мессенджер или на e-mail?","source_page":"24"},{"text":"Понимаю, поэтому буду рад ответить на вопросы, если они появятся, и рассказать про актуальные акции, хорошо?","source_page":"24"},{"text":"Хорошо! Пока Вы смотрите основное, я сейчас покажу Вам некоторые новинки и предложение месяца, чтобы у Вас было полное представление...","source_page":"24"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"Я хотел бы работать с более надежной компанией","keywords":["хотел","работать","более","надежной","компанией"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, понимаю, надежность сейчас для многих компаний важнее, чем цена. Скажите, какие гарантии мы можем дать дополнительно, чтобы работать с Вами?","source_page":"26"},{"text":"А Вы рассматриваете рекомендации (наших клиентов, или компаний из той же отрасли)?","source_page":"26"},{"text":"ИО, по опыту, когда клиенты говорят о надежности, очень часто имеют ввиду наш опыт, реализованные проекты и отзывы от клиентов. А что для вас было бы важно, чтобы убедиться, что наша компания – это серьезный партнер, с которым можно и нужно работать?","source_page":"26"},{"text":"ИО, надежность контрагентов очень важна, мы это понимаем, поэтому со своей стороны готовы предоставить все необходимые материалы. Что могло бы Вам помочь в принятии решения?","source_page":"26"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"У Вас много негативных отзывов","keywords":["много","негативных","отзывов"],"client_phrase":"","hidden_reason":"","answers":[{"text":"А какие именно отзывы Вы имеете в виду? ИО, мы же с Вами понимаем, кто и зачем может быть заинтересован в такой информации о крупной и давно работающей компании (на высоко конкурентном рынке)","source_page":"26"},{"text":"Да, я тоже сталкивался с негативными оценками. И, к сожалению, люди пишут негативные отзывы гораздо легче, чем положительные. Тут важно понимать, что у компании много клиентов и много отзывов. И отзывов разных. Готов Вас познакомить с благодарственными письмами и рекомендациями от клиентов","source_page":"26"},{"text":"ИО, репутация в наше время – это все. Поэтому мы особое внимание уделяем тому, чтобы клиенты получали то, что хотели. Какие отзывы Вы имеете в виду? Давайте разберемся","source_page":"26"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"Никогда раньше о Вас не слышал","keywords":["никогда","раньше","слышал"],"client_phrase":"","hidden_reason":"","answers":[{"text":"С большинством наших клиентов мы начинали сотрудничать ровно с этой же фразы, давайте смотреть друг на друга в деле","source_page":"27"},{"text":"Да, есть компании, которые у многих на слуху, рекламируются по ТВ и радио. Мы из другой ниши, долгое время специализировались на услугах для государственных корпораций и крупных компаний и хорошо себя в этом зарекомендовали, на текущий момент прорабатываем новые ниши, в связи с чем активно работаем с предпринимателями и готовы давать более выгодные условия","source_page":"27"},{"text":"Скорее всего, Вы слышали о наших проектах (перечисляем). Ранее работали только с крупными заказчиками и застройщиками (например, ____), с этого года развиваем новое / розничное направление","source_page":"27"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"У Вас мало опыта! Вы молодая компания!","keywords":["мало","опыта","молодая","компания"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Если смотреть на саму компанию, то да – нам всего 1-2 года. При этом если посмотреть на опыт и реализованные проекты наших сотрудников, видно, что команда готова справиться с большинством задач. Давайте посмотрим по Вашей ситуации","source_page":"27"},{"text":"ИО, мы молодая компания, это так. При этом наши специалисты имеют суммарный опыт в сфере более 20 лет. И что еще важно – мы понимаем, что нам для развития нужны Ваши положительные отзывы и результаты. Мы сделаем все, чтобы Вы получили результат. Попробуем?","source_page":"27"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"У Вас нет кейсов с моей спецификой / Вы не разбираетесь в моем бизнесе","keywords":["кейсов","моей","спецификой","разбираетесь","моем","бизнесе"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Действительно, именно с таким бизнесом мы не работали. При этом мы работали уже со 100+ разными бизнесами, в каждом есть своя специфика, и мы понимаем, насколько важно это учитывать для эффективной работы. Вы продаете услуги / товары, а мы работали с десятками компаний, которые тоже продают услуги / товары. Давайте рассмотрим специфику Вашего проекта и согласуем план работы с учетом всех нюансов","source_page":"28"},{"text":"Конечно, мы не разбираемся в Вашем продукте так глубоко, как Вы. При этом мы разбираемся в своей области. И когда мы запускаем проект, мы всегда проводим встречи с Вами, чтобы разобраться в специфике и учесть все нюансы. Например, у нас есть похожие кейсы из других сфер, смотрите...","source_page":"28"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"Слишком хорошо, чтобы быть правдой. В чем подвох?","keywords":["слишком","хорошо","правдой","подвох"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Предложение действительно выгодное. Мы даже проводили опросы покупателей, чтобы разработать именно такой продукт. Кстати, Вы уже видели кейсы наших клиентов?","source_page":"28"},{"text":"Спасибо, что так оценили. Мы изучили рынок, конкурентов, спрос покупателей, что позволило нам организовать работу еще лучше и сделать такое предложение. Давайте обсудим план проекта в деталях?","source_page":"28"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"Я покупал такое раньше – это не работает! Пустая трата денег!","keywords":["покупал","такое","раньше","работает","пустая","трата","денег"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Жаль слышать, что так вышло. Что именно Вы покупали? Это вообще не сработало или какой-то эффект все-таки был?","source_page":"29"},{"text":"Понял Вас. Я знаю нескольких клиентов, которые раньше уже пробовали это у других поставщиков, но эффекта не было. Когда мы с ними погружались в детали – сразу понимали причину. Давайте разберем Вашу ситуацию?","source_page":"29"},{"text":"Я знаю, насколько важно, чтобы Ваши инвестиции окупились. Поэтому у нас есть таблица для расчета окупаемости и детальная схема работы с учетом Вашей специфики. Давайте посмотрим, чтобы избежать ошибок и получить нужный результат","source_page":"29"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"У Вас нет гарантии результатов!","keywords":["гарантии","результатов"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, гарантии важны, и хочется быть уверенным, что результат точно будет. При этом мы всегда говорим клиентам, что на конечный результат влияет не только наш продукт, но и то, как сам клиент это внедряет, использует, соблюдает инструкции и так далее. Мы гарантируем качество продукта и не даем ложных обещаний по результатам клиента","source_page":"29"},{"text":"У нас есть гарантии качества продукта (услуги) и репутация на рынке – за 10 лет мы реализовали сотни проектов. Такая репутация формируется годами, поэтому мы не даем тех гарантий, которые звучат красиво, но юридически нереализуемы. Вы же согласны, что для результата Вам самостоятельно нужно грамотно использовать продукт и выполнять конкретные задачи?","source_page":"29"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"Я сейчас оплачу, а вдруг потом результата не будет / не буду это ! использовать в работе","keywords":["оплачу","вдруг","потом","результата","буду","использовать","работе"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Вы же все равно планируете в этом направлении развиваться? И наш продукт поможет Вам быстрее получить результат. Это подтверждают многие кейсы. Давайте согласуем план проекта, чтобы понять, что Вам точно это будет полезно, хорошо?","source_page":"30"},{"text":"Если Вы не будете это использовать, то, конечно, это отразится на результатах. Поэтому перед покупкой важно определиться, точно ли это нужно именно сейчас и закрывает ли это Ваши задачи. Давайте сверимся...","source_page":"30"},{"text":"Давайте просчитаем потенциальный эффект от внедрения для Вашей ситуации? Если увидим, что есть смысл – то Вы запланируете оплату, как считаете?","source_page":"30"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"О Вас нет отрицательных отзывов! Это подозрительно – Вы их удаляете!","keywords":["отрицательных","отзывов","подозрительно","удаляете"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Мы не удаляем отзывы, просто стараемся работать так, чтобы клиенты оставались довольны. Показать Вам примеры сложных ситуаций, которые мы успешно решили?","source_page":"30"},{"text":"У нас действительно положительная репутация, потому что мы на каждом этапе работы собираем обратную связь клиентов. И если видим, что что-то может пойти не так – оперативно реагируем. Это позволяет нам не получать негативных отзывов","source_page":"30"},{"text":"Понимаю, почему это может казаться странным. Негативных отзывов нет, потому что мы работаем над тем, чтобы каждый клиент был счастлив. Это главное для нас","source_page":"30"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Низкое доверие","stage":"Формирование доверия","objection":"Это Китай! Не доверяю этой продукции!","keywords":["китай","доверяю","этой","продукции"],"client_phrase":"","hidden_reason":"","answers":[{"text":"К производству в Китае действительно раньше было много вопросов. При этом сейчас даже многие известные бренды производят свои товары там и контролируют качество на каждом этапе. У нас тоже есть несколько этапов контроля качества, благодаря чему вопросов по качеству не возникает. Видели отзывы наших клиентов?","source_page":"31"},{"text":"Для нас качество сборки очень важно, так как это напрямую влияет на нашу репутацию. Именно поэтому мы регулярно выезжаем на производство в Китай, обсуждаем стандарты качества. Плюс у нас есть свой отдел контроля на территории производителя – это позволяет каждый день держать руку на пульсе, оценивать качество и внедрять пожелания наших клиентов","source_page":"31"},{"text":"Не доверяете из-за страны производства или из-за конкретного бренда / производителя данной продукции?","source_page":"31"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Мы уже работаем с другими (уже есть поставщик)","keywords":["работаем","другими","поставщик"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Отлично. Именно поэтому я Вам и позвонил. Мы как раз в приоритете начинаем работать с теми компаниями, которые уже имеют опыт подобного сотрудничества. Скажите, Вы принципиально работаете только с этим поставщиком, или готовы рассматривать другие варианты?","source_page":"33"},{"text":"ИО, скажите, Вы только с этим поставщиком планируете работать, или можете рассмотреть и другие предложения, если они будут более интересные?","source_page":"33"},{"text":"ИО, как Вы смотрите на то, чтобы просто сравнить условия Вашего поставщика с нашими? Ведь для бизнеса такое сравнение может быть полезно, так ведь?","source_page":"33"},{"text":"ИО, когда я первый раз общаюсь с руководителем компании, я часто слышу, что поставщики есть, и схема работы отлажена. При этом, когда мы делаем сравнение, часто видим, что есть моменты, которые можно улучшить. Именно поэтому я не предлагаю сразу ничего менять, я предлагаю сравнить то, что у Вас есть, с нашими условиями. Если увидим зоны роста, будем двигаться дальше. Что скажете?","source_page":"33"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Все устраивает. Менять ничего не буду.","keywords":["устраивает","менять","ничего","буду"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Конечно, какой смысл менять что-то, если не видна выгода. Я просто хотел понять, если мы сейчас увидим, что у нас будет ощутимо выгоднее для Вас, можем обсуждать дальше?","source_page":"33"},{"text":"Скажите, а Вы у этого поставщика заказываете и ТОВАР А, и ТОВАР Б и С? Бывает такое, что у нас намного выгоднее заказывать, к примеру, ТОВАР Б. Вы его используете?","source_page":"33"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"У конкурентов дешевле","keywords":["конкурентов","дешевле"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Бывает такое, что цена на некоторые услуги отличается. Давайте сравним стоимость и функционал. Скажите, а у них данная опция есть? Это сильно влияет на цену. Без этого у нас не 90, а 85.","source_page":"34"},{"text":"А комплектация такая же? А сроки? А сервис какой предлагают? Гарантия тоже 1 год? Производитель? Очень подозрительно, ведь цена ниже рынка. У меня был клиент, который… (история)","source_page":"34"},{"text":"Вы знаете, как это бывает, каждая компания делает на чем-то акцент и может предложить по определенной категории цену ниже, а по другим – наоборот все будет дороже. Давайте сравним в целом стоимость проекта","source_page":"34"},{"text":"Я знаю, что некоторые конкуренты заявляют более низкую цену, и вот почему: 1) __, 2) __.","source_page":"34"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"У конкурентов условия лучше (поставки, сроки)","keywords":["конкурентов","условия","лучше","поставки","сроки"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Скажите, пожалуйста, на какие варианты ориентируетесь?","source_page":"34"},{"text":"ИО, учитывая, что условий в целом много, скажите, какие из них для Вас самые важные: сроки, цена, поддержка, гарантия?","source_page":"34"},{"text":"ИО, я понимаю, что сроки очень важны, иногда даже важнее, чем остальные условия по продукту... Именно поэтому я со своей стороны сделаю все возможное, чтобы сократить сроки и, кроме этого, я буду держать Вас в курсе работы над Вашей заявкой. Я знаю, что это для Вас важно, и мы это учтем в работе","source_page":"34"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Мы работаем с постоянным поставщиком уже 10 лет!","keywords":["работаем","постоянным","поставщиком"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Я знаю, что Вы давно на рынке. За это время Вы же хотя бы одного поставщика или партнера поменяли? Потому что Вам это было выгоднее. Сейчас я не предлагаю менять, я предлагаю сравнить и сделать выводы","source_page":"35"},{"text":"ИО, именно поэтому я сразу ничего не стал предлагать. Я понимаю, что в такой ситуации должна быть существенная выгода, чтобы Вы решили сменить поставщика. Давайте обсудим","source_page":"35"},{"text":"Очень Вас понимаю, сами ценим постоянных партнеров, с которыми нас уже многое связывает. При этом рынок меняется и сейчас такое время, когда полезно иметь несколько вариантов: можно не только сэкономить, но и подстраховаться","source_page":"35"},{"text":"Понимаю, поэтому не предлагаю отказываться от проверенного временем поставщика. Мы можем просто сравнить тарифы поставщика с нашими. И если увидим существенную экономии, Вы можете либо получить скидку у существующего поставщика, либо начать работать с нами по некоторым направлениям","source_page":"35"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Другие компании работают быстрее Вас!","keywords":["другие","компании","работают","быстрее"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Скажите пожалуйста, а с какими компаниями Вы сравниваете? Какие именно работы обещают сделать в такие сроки?","source_page":"35"},{"text":"Скажите, а на какие сроки ориентируетесь?","source_page":"35"},{"text":"Да, мы знаем, что есть компании, которые делают это быстрее, при этом мы до сих пор говорим клиентам, что сделаем это за неделю. А знаете почему? (рассказываем подробно о плане работы по продукту)","source_page":"35"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"У конкурентов доставка / поддержка бесплатно, а у вас нет!","keywords":["конкурентов","доставка","поддержка","бесплатно"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Поддержка и доставка, конечно, влияют на Ваши расходы. Поэтому давайте комплексно оценим все плюсы и минусы. Многие клиенты после сравнения видят, что несмотря на то, что у нас доставка и поддержка не бесплатные – с нами в итоге получается выгоднее. Посчитаем?","source_page":"36"},{"text":"У нас есть разные варианты сотрудничества, в том числе и с бесплатной доставкой / поддержкой. Давайте выберем лучший тариф для Вас...","source_page":"36"},{"text":"Да, я знаю, что некоторые компании закладывают стоимость \"доставки и поддержки\" в стоимость продукта, и говорят, что они \"бесплатные\". Мы так не делаем и сообщаем клиенту только стоимость продукта. Остальное Вы можете докупить самостоятельно: например, воспользоваться своей службой доставки. Давайте в целом оценим, насколько наше предложение выгодное...","source_page":"36"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"У конкурентов дороже, но у них больше кейсов!","keywords":["конкурентов","дороже","больше","кейсов"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понятно, что кейсы важны. При этом важно, чтобы кейсы были достоверными и подтверждали ту экспертность, которая нужна именно в Вашей ситуации. Давайте я покажу конкретные кейсы, и Вы увидите, как качественно мы проработываем все ситуации. Кстати, так как у нас все кейсы подтвержденные, я смогу по согласованию с клиентом дать Вам его контакт, чтобы Вы напрямую уточнили все вопросы, как Вам?","source_page":"37"},{"text":"Мы моложе, чем конкуренты, при этом сейчас хорошо растем и особое внимание уделяем кейсам. У нас есть подборка кейсов с таким запросом, как у Вас – давайте посмотрим их. Если у Вас останутся вопросы по нашей экспертности, я с удовольствием дам Вам дополнительную информацию","source_page":"37"},{"text":"Я понимаю, что Вы сравниваете разные варианты. Не могу ничего сказать про кейсы конкурентов. Я готов показать Вам наши кейсы в аналогичных проектах, и Вы увидите, насколько качественно мы прорабатываем все ситуации. Также давайте составим конкретный план действий по Вашему проекту, и, если Вас все устроит, начнем работу","source_page":"37"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Мои знакомые покупали у Ваших конкурентов и рекомендуют их","keywords":["знакомые","покупали","ваших","конкурентов","рекомендуют"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понятно, что мнения друзей важны. А Вы уже смотрели предложения конкурентов? Как Вы лично оцениваете их?","source_page":"38"},{"text":"Понимаю Вас. А что для них было самое ценное? Почему рекомендуют их? А что им не понравилось?","source_page":"38"},{"text":"Я сам часто прислушиваюсь к рекомендациям. При этом бывают ситуации, когда важно непредвзято оценить все предложения. Ведь, если мы еще не работали с Вашим знакомыми, это не значит, что у нас предложение и продукт хуже. Давайте взвесим все \"за и против\"...","source_page":"38"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Я сначала соберу все варианты от конкурентов, а потом решу. Вы не одни!","keywords":["сначала","соберу","варианты","конкурентов","потом","решу","одни"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Хорошо, мне приятно, что мое предложение тоже будете рассматривать. Скажите, пожалуйста, а какие у Вас основные параметры при выборе, чтобы я сделал на этом акцент в предложении?","source_page":"38"},{"text":"Понимаю, а что для Вас ключевое при выборе? А что помимо цены?","source_page":"38"},{"text":"При сборе предложений в нашей сфере можно столкнуться с тем, что довольно сложно объективно их сравнить. Не все поставщики раскрывают в предложении все условия. Давайте я сразу выделю то, что для Вас наиболее важно. Расскажите, на что будете в первую очередь смотреть (помимо цены)?","source_page":"38"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Я покупаю только у компаний из ТОП-3 – Вы не подходите!","keywords":["покупаю","компаний","подходите"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, ТОП-3 – это компании лидеры рынка. А по каким рейтингам или критериям будет ТОП-3?","source_page":"39"},{"text":"Хорошо. А какие еще параметры, кроме \"ТОП-3\", для Вас важны? Сроки? Гарантия? Цена? Мы подготовим бесплатно продуманный вариант реализации Вашего проекта с учетом специфики. В любом случае наше предложение усилит Ваши позиции в переговорах с ТОП-3...","source_page":"39"},{"text":"Вы имеете в виду работу по всем проектам или есть какие-то направления, где \"ТОП-3\" не является категоричным параметром, и Вы можете рассматривать более выгодные варианты?","source_page":"39"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Конкуренты","stage":"Сравнение с конкурентами","objection":"Уже выбрали другого поставщика, спасибо!","keywords":["выбрали","другого","поставщика","спасибо"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Хорошо, спасибо за честность. Дайте, пожалуйста, обратную связь, как наше предложение смотрелось на фоне другого? Чего не хватило? Будем учитывать это в будущем!","source_page":"39"},{"text":"Ок, понял! То есть уже подписали договор и сделали оплату, или только планируете это делать?","source_page":"39"},{"text":"То есть Вы определились с услугами по настройке CRM у этого поставщика? А по подбору команды менеджеров ОП что думаете? У нас сейчас есть в базе несколько кандидатов с опытом в Вашей сфере, посмотрим их?","source_page":"39"},{"text":"Понял вас. Спасибо, что рассматривали нас. Давайте будем на связи – я Вам вышлю подарок по теме...","source_page":"39"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Я не решаю (решает руководство, головной офис)","keywords":["решаю","решает","руководство","головной","офис"],"client_phrase":"","hidden_reason":"","answers":[{"text":"А лично Вам как? Какой вариант / формат работы больше подходит?","source_page":"41"},{"text":"Скажите, а на Ваш взгляд, это вообще может быть интересно Вашему руководству? Такая проблема бывает? Если мы сейчас обсудим и увидим, что это Вам в целом полезно, Вы сможете дать обратную связь руководству?","source_page":"41"},{"text":"Конечно, в любом случае принимает решение руководитель. При этом, очень часто он обращается к своим сотрудникам при принятии решения. Как Вам наше предложение? Что можно улучшить, чтобы Вы могли нас порекомендовать?","source_page":"41"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Нужно посоветоваться","keywords":["посоветоваться"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Конечно, советуйтесь. А Вас лично продукт сейчас полностью устраивает или что-то не подходит?","source_page":"41"},{"text":"Я понимаю, что в компании, скорее всего, решение по таким вопросам принимает несколько человек. Но я слышал (мне сказали), что для начала важно с Вами определиться, подходит это Вам или нет (повышаем статус клиента)","source_page":"41"},{"text":"Опыт показывает, что 70 % продуманных предложений профессиональное руководство одобряет. Давайте вместе встретимся с Вашим директором, чтобы обсудить детали","source_page":"41"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Поговорите для начала с…","keywords":["поговорите","начала"],"client_phrase":"","hidden_reason":"","answers":[{"text":"А они сами эти вопросы решают, или все же вместе с Вами?","source_page":"42"},{"text":"Я понимаю, что Вы цените свое время. Именно поэтому я хотел у Вас, как у руководителя, сразу уточнить, что для Вас является наиболее важным при выборе компании?","source_page":"42"},{"text":"ИО, конечно, давайте запишу контакт. Скажите, а для Вас, как для руководителя, что наиболее важно при работе с такими компаниями?","source_page":"42"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Мне нужно получить одобрение специалиста (подчиненного), чтобы перейти к договору и оплате","keywords":["получить","одобрение","специалиста","подчиненного","перейти","договору","оплате"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понимаю, что детали нужно согласовать с ответственным специалистом, но сама идея этого продукта / проекта – как Вам, как руководителю?","source_page":"42"},{"text":"Да, сейчас у нас стратегическая встреча, чтобы понять, насколько это вписывается в развитие Вашей компании. Если да, то детали мы можем обсудить и согласовать со специалистом и потом вернуться к Вам для финального утверждения, хорошо?","source_page":"42"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Мы должны провести совещание с командой и обсудить Ваше предложение","keywords":["должны","провести","совещание","командой","обсудить","ваше","предложение"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понимаю, совещание с командой позволяет всесторонне обсудить предложение. Обычно мы тоже к таким встречам подключаемся и сразу даем необходимую информацию всем участникам (по ИТ, безопасности, юристам и т.д.). Когда планируете такую встречу провести?","source_page":"43"},{"text":"Это отлично. Давайте, чтобы сэкономить время команды, я отправлю Вам тезисы для обсуждения и сам презентую эту программу – у нас есть буквально 3 слайда как раз для командных встреч. После этого смогу ответить на вопросы команды. Что думаете?","source_page":"43"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Я просто собираю предложения от разных компаний, чтобы передать руководителю","keywords":["собираю","предложения","разных","компаний","передать","руководителю"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Хорошо. А я могу у Вас предварительно несколько вопросов уточнить по ситуации, чтобы подготовить для Вашего руководства конкретное предложение? Можем с Вами обсудить или напрямую связаться с руководителем?","source_page":"43"},{"text":"О, понимаю. Раз Вы занимаетесь этим вопросом, скорее всего, знаете, какие критерии наиболее важны для руководителя, помимо цены?","source_page":"43"},{"text":"Да, сейчас Вы просто собираете предложения, но потом руководитель может столкнуться с проблемой – довольно сложно будет объективно сравнить предложения разных поставщиков, так как многие не прописывают нюансы в предложении. Давайте подготовим максимально конкретный расчет, хорошо? Есть несколько вопросов...","source_page":"43"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Как скажет мой специалист (ИТ, бухгалтер, юрист и тд) – так я и сделаю. Не хочу погружаться в детали Вашего предложения","keywords":["скажет","специалист","бухгалтер","юрист","сделаю","погружаться","детали","вашего"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Согласен, что это зона ответственности специалиста. При этом, так как это влияет на деньги компании, я хотел в первую очередь уточнить у Вас, готовы Вы ли стратегически этот вопрос обсуждать? Если да, то детали обсужу со специалистом, и мы вернемся к Вам за финальным подтверждением...","source_page":"44"},{"text":"Давайте я Вам вышлю тезисы – это информация именно для руководителя. А детали обсужу с Вашим специалистом, хорошо?","source_page":"44"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Полномочия принятия решения","stage":"Принятие решения","objection":"Я передал счет в бухгалтерию на оплату. Скоро должны оплатить","keywords":["передал","счет","бухгалтерию","оплату","скоро","должны","оплатить"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Рад, что процесс запущен. Как мне связаться с бухгалтерией для подтверждения платежа и подготовки документооборота?","source_page":"44"},{"text":"Хорошо. А для Вас важно в какие даты стартовать проект? Я свяжусь с бухгалтером, чтобы держать вопрос на контроле","source_page":"44"},{"text":"А все остальные этапы согласования пройдены? Юристы и другие специалисты? Отлично! Буду на связи с бухгалтерией","source_page":"44"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Я подумаю","keywords":["подумаю"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, в целом для Вас это актуальный вопрос? Тогда давайте попробуем [альтернатива] (продвижение вперед)","source_page":"46"},{"text":"ИО, Вы же все равно планируете в ближайшее время покупать / устанавливать, давайте я Вас запишу (сделаю, установлю, проведем и т.д.)","source_page":"46"},{"text":"ИО, а в целом подходит / нравится предложение, или есть моменты, которые смущают?","source_page":"46"},{"text":"Конечно, надо все взвесить. Только у меня такое чувство (ощущение), что Вас что-то смущает. Что мы можем изменить, улучшить?","source_page":"46"},{"text":"Кстати, если Вы будете сравнивать (для полноты картины), еще такой момент надо учесть…. (говорим о рисках для клиента, повышаем экспертность)","source_page":"46"},{"text":"Конечно, подумайте. Единственный нюанс – возможно, при обдумывании встанет вопрос по датам / окончательным ценам…","source_page":"46"},{"text":"А другие варианты уже смотрели? (ответ) Кстати, есть нюанс, иначе – риск (негатив)","source_page":"46"},{"text":"Кстати, ИО, многие компании, которым нужно (для которых важно) [задача], уделяют особое внимание [детали], потому что [влияние на окупаемость].","source_page":"46"},{"text":"Можно и позже начать, но, если честно, здесь есть некоторые риски. Смотрите…","source_page":"46"},{"text":"Хорошо, смотрите, ИО, мы с Вами это обсуждаем 2 месяца, фактически, если бы сразу приняли решение, уже сейчас бы у Вас были (первые клиенты, обратная связь, возможность управления и т.д.)","source_page":"46"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Оплачу позже!","keywords":["оплачу","позже"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Ок, можно и потом оплатить. Важно уже сейчас определиться, что Вам действительно нужно и подходит","source_page":"47"},{"text":"Можно и позже, единственный нюанс – сами видите, доллар пошел вверх, цена может измениться, поэтому предлагаю сейчас зафиксировать цену предоплатой / заявкой","source_page":"47"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Впереди праздники, сложности, кризис. Не до Вас!","keywords":["впереди","праздники","сложности","кризис"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, в нашей стране праздники почти каждый день)) Сейчас важно понять, подходит ли Вам в целом такой вариант работы, а детали можно обсуждать потом. Скажите, как у Вас…","source_page":"47"},{"text":"Хорошо. У меня есть к Вам просьба. Для обратной связи можете оценить по 10- балльной шкале мое предложение? (Если клиент ответил, то спрашиваем, почему не 10 и работаем с истинным возражением)","source_page":"47"},{"text":"Понимаю, что сейчас много забот, поэтому предлагаю даже не обсуждать детали, а определиться в целом, насколько это Вам подходит. И если принципиальное \"да\", то всю остальную рутину мы берем на себя","source_page":"47"},{"text":"ИО, возможно, выглядит так, что процесс займет много времени и лучше его отложить. При этом именно сейчас в праздники / кризис выгоднее всего это сделать. Вот почему…","source_page":"47"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Давайте обсудим позже","keywords":["давайте","обсудим","позже"],"client_phrase":"","hidden_reason":"","answers":[{"text":"ИО, хорошо, а вообще этот вопрос для Вас актуален сейчас?","source_page":"48"},{"text":"Можно и позже обсуждать, при этом здесь есть некоторые риски и нюансы. Смотрите…","source_page":"48"},{"text":"Хорошо. Сам [основной проект] можем обсудить позже, а пока можем записать Вас / запланировать пробную партию / тест на этой неделе. Это поможет принять решение","source_page":"48"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Я занят, у меня мало времени (на встрече)","keywords":["занят","мало","времени","встрече"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понял, в таком случае можем поступить так: 1) Верхнеуровнево обсуждаем с Вами вопрос за 10 минут, а далее обсуждаю детали с Вашим заместителем или 2) переносим встречу, чтобы более предметно все обсудить. Как поступим?","source_page":"48"},{"text":"ИО, я подготовился к нашей встрече и рассчитываю, что 20 минут нам хватит, чтобы понять, сможем мы быть полезны друг другу или нет. 20 минут у Вас есть?","source_page":"48"},{"text":"Я понимаю Вас, аврал и все такое. Предлагаю назначить другой день, когда у Вас получится в спокойной обстановке все обсудить","source_page":"48"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"У меня нет времени это обсуждать (по телефону)","keywords":["времени","обсуждать","телефону"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Я понимаю, что Вы не планировали со мной общаться и не ожидали моего звонка. Поэтому буду краток – всего 2 вопроса, чтобы понять, имеет ли смысл дальше общаться или нет. Скажите…","source_page":"49"},{"text":"Хорошо, ИО, я перезвоню Вам позже. Скажите, пожалуйста, сегодня после обеда будет 10 минут для разговора?","source_page":"49"},{"text":"ИО, Вы извините за звонок без предупреждения. Я хотел уточнить всего 2 вопроса насчет работы сайта, это не больше 2-х минут. Хорошо?","source_page":"49"},{"text":"ИО, я буду краток и задам буквально 2 вопроса, чтобы понять, есть ли смысл общаться дальше и назначать встречу или нет. Скажите…","source_page":"49"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Мне некогда заниматься оформлением, внедрением…","keywords":["некогда","заниматься","оформлением","внедрением"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Понимаю, со многими работаем, знаем, насколько руководителям не хочется во все это вникать, поэтому уже подготовили подробную схему работы, чтобы с минимальным погружением установить, внедрить","source_page":"49"},{"text":"ИО, что касается оформления – от Вас только принципиальное \"да\", а всю рутину мы берем на себя. Не первый год занимаемся, это уже отлажено","source_page":"49"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Давайте встретимся еще раз…","keywords":["давайте","встретимся"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Конечно, мы с удовольствием встретимся с Вами еще раз, при этом обратите внимание, что те условия, которые мы обсуждаем сейчас, могут поменяться. Поэтому лучше сегодня их забронировать / зарезервировать / подать предварительную заявку (т.е. зацепить клиента и сразу посмотреть его реальную готовность к сотрудничеству)","source_page":"50"},{"text":"Итак, ИО, мы же сегодня 10-ый раз встречаемся, и я чувствую, что мы уже близки к сотрудничеству, но что-то нам мешает окончательно договориться. Давайте сейчас обсудим, что это, чтобы мы могли скорректировать наше предложение и договориться с Вами уже завтра / послезавтра…","source_page":"50"},{"text":"Конечно. И чтобы следующая встреча была более предметной, давайте сейчас обсудим вопрос / заполним заявку и т.д.","source_page":"50"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Пришлите коммерческое предложение, подробные материалы (на встрече)","keywords":["пришлите","коммерческое","предложение","подробные","материалы","встрече"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Конечно, вышлю Вам предложение. Сориентируйте, что для Вас наиболее важно при работе с (Ваша сфера) компаниями?","source_page":"50"},{"text":"Хорошо, я подготовлю предложение, а в целом как Вам такой формат работы?","source_page":"50"},{"text":"Хорошо, подготовлю. Кстати, у нас есть 3 варианта реализации проекта. Вам какой больше подходит?","source_page":"50"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Пока решили не оплачивать счет","keywords":["пока","решили","оплачивать","счет"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Хорошо. Скажите, а что изменилось? А в целом «проблема / задача» осталась? В таком случае, можно поступить так…","source_page":"51"},{"text":"ИО, Вы планируете его оплатить чуть позже или передумали оплачивать?","source_page":"51"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Пришлите коммерческое предложение, подробные ! материалы (по телефону)","keywords":["пришлите","коммерческое","предложение","подробные","материалы","телефону"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Правильно понимаю, что принципиальный интерес к самой услуге есть? В таком случае скажите, пожалуйста... (задаем вопросы + призыв к целевому действию)","source_page":"51"},{"text":"ИО, я ценю и Ваше, и свое время, поэтому прежде чем высылать предложение я хотел бы убедиться, что Вам оно будет действительно выгодно. Для этого мне надо понять пару моментов по бизнесу. Их можно обсудить на встрече минут за 20, и сразу все посчитаем. Что скажете? Завтра будет минут 20?","source_page":"51"},{"text":"ИО, ну зачем Вам общее типовое предложение, где нет конкретики? Давайте предварительно обсудим Вашу ситуацию, я задам несколько вопросов по бизнесу и сделаю конкретный расчет, из которого мы увидим, выгодное это предложение для Вас или нет. Завтра могу подъехать?","source_page":"51"},{"text":"Вы знаете, я даже не использую КП, т.к. в принципе программа достаточно прозрачная. Я позвонил Вам поинтересоваться – актуальный это для Вас вопрос или нет. Если да, то давайте обсудим его подробнее (можно, на встрече) и далее определимся, в каком формате работать","source_page":"51"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Куплю в следующий раз (следующий месяц, поток, набор, группу)","keywords":["куплю","следующий","месяц","поток","набор","группу"],"client_phrase":"","hidden_reason":"","answers":[{"text":"В следующий раз, потому что сейчас нет времени на это или по другим причинам?","source_page":"52"},{"text":"То есть вопрос с покупкой все еще актуален, просто сейчас по каким-то причинам не получается? Расскажите, пожалуйста, почему думаете отложить?","source_page":"52"},{"text":"Хорошо, что в целом рассматриваете покупку. При этом, сами видите, ситуация быстро меняется, и это влияет на стоимость, наличие. Если Вы понимаете, что Вам все равно это понадобится через пару месяцев, то есть ли смысл откладывать это? Давайте еще раз оценим окупаемость...","source_page":"52"},{"text":"Хорошо, а сколько раз Вы уже переносили покупку? Уже полгода? Представляете, если бы полгода назад приобрели, уже бы сегодня Вы чувствовали эффект. Вы же все равно планируете развивать бизнес? Давайте взвесим все \"за и против\": возможно, именно сейчас лучшее время для покупки...","source_page":"52"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Сейчас сезон, не будем покупать","keywords":["сезон","будем","покупать"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, в сезон нагрузка очень высокая, и часто нет времени на другие задачи. Именно поэтому я совсем коротко хотел уточнить – для Вас же эта покупка будет акутальна позже, как считаете? У нас есть программа бронирования, чтобы Вы избежали будущего повышения цен (в сезон цены повышаются). Смотрите, сколько можно сэкономить...","source_page":"53"},{"text":"Я понимаю, что сейчас у Вас сезон. Именно поэтому связался с Вами. Если запустить этот проект сейчас, можно получить максимальный эффект как раз за счет высокого сезона. Для запуска нужно минимум времени – я все подготовил и рассчитал, смотрите...","source_page":"53"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Сейчас несезон, не будем покупать","keywords":["несезон","будем","покупать"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, я посчитал, что до начала сезона осталось пару месяцев. И подготовил для Вас предложение с выгодными условиями – как раз к началу сезона все успеем сделать, чтобы эффект был у Вас максимальный и быстрый...","source_page":"53"},{"text":"Именно поэтому и позвонил Вам. Есть несколько идей для \"несезона\", которые помогают получить эффект очень быстро. Смотрите...","source_page":"53"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Я хочу подождать и посмотреть, как изменится рынок, и потом принимать решение","keywords":["подождать","посмотреть","изменится","рынок","потом","принимать","решение"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Да, я тоже думал об этом. У меня есть 2 сценария о том, что может проиcходить на рынке в ближайшее время. Давайте обсудим, чтобы понять, как лучше действовать сейчас...","source_page":"54"},{"text":"Согласен, что сейчас высокая неопределенность. Именно поэтому я подготовил проект / расчет / схему реализации проекта, чтобы Вы могли принять взвешенное решение с учетом рисков в этой отрасли...","source_page":"54"},{"text":"Хорошо, а какие риски Вы видите? Какие изменения для Вас были бы позитивными и негативными?","source_page":"54"}],"recommendation":"","source":{"book":"275 готовых ответов на возражения","author":"Олег Шевелев"}},{"category":"Время, готовность покупать","stage":"Сроки и готовность к покупке","objection":"Я сейчас сосредоточен на другом проекте. Завершим его – и вернемся к обсуждения с Вами","keywords":["сосредоточен","другом","проекте","завершим","вернемся","обсуждения","вами"],"client_phrase":"","hidden_reason":"","answers":[{"text":"Хорошо, в детали сможем погрузиться позже. А сейчас хотя бы предварительно скажите, как Вам идея нашего продукта? Как это может отразиться на бизнесе?","source_page":"54"},{"text":"Я понимаю, насколько важно function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

async function copyText(text){
  text=String(text ?? '');
  if(!text.trim()){showToast('Нет текста для копирования');return false;}
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      showToast('Скопировано');return true;
    }
  }catch(e){}
  const ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();
  showToast(ok?'Скопировано':'Не удалось скопировать. Выделите текст вручную.');
  return ok;
}

});

}

function goHome(){
  document.getElementById("moduleScreen").classList.remove("active");
  document.getElementById("homeScreen").classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function openModule(name){
  document.getElementById("homeScreen").classList.remove("active");
  document.getElementById("moduleScreen").classList.add("active");
  renderModule(name);
  window.scrollTo({top:0,behavior:"smooth"});
}

function findSolution(){
  const text=document.getElementById("taskInput").value.toLowerCase().trim();
  if(!text){showToast("Опишите задачу или выберите раздел");return;}
  if(text.includes("сообщен")||text.includes("касани")||text.includes("сопрано")||text.includes("вопросы при разговор")){openModule("client");return;}
  if(text.includes("возраж")||text.includes("дорого")||text.includes("скид")){openModule("objections");return;}
  if(text.includes("трейд")||text.includes("возврат")||text.includes("оформить ремонт")||text.includes("заявк")){openModule("returns");return;}
  if(text.includes("оформ")||text.includes("отправ")||text.includes("возврат")||text.includes("трейд")||text.includes("гарант")||text.includes("заявлен")||text.includes("документ")||text.includes("посыл")){openModule("returns");return;}
  if(text.includes("ошиб")||text.includes("не включ")||text.includes("протеч")||text.includes("пар")||text.includes("накип")||text.includes("электрод")||text.includes("не работает")||text.includes("не готовит")||text.includes("ремонт")){openModule("repair");return;}
  if(text.includes("целев")||text.includes("ца")||text.includes("аудитор")){openModule("audience");return;}
  if(text.includes("продукт")||text.includes("характерист")||text.includes("инструкц")||text.includes("аквалайф")||text.includes("akvalife")){openModule("knowledge");return;}
  showToast("Не удалось уверенно определить раздел — выберите его ниже");
}

function renderModule(name){
  const box=document.getElementById("moduleContent");
  if(name==="knowledge"){renderKnowledge(box);return;}
  if(name==="audience"){renderAudience(box);return;}
  if(name==="objections"){renderObjections(box);return;}
  if(name==="client"){renderClient(box);return;}
  if(name==="returns"){renderReturns(box);return;}
  if(name==="repair"){renderRepair(box);return;}
  box.innerHTML=moduleHeader("Раздел не найден","Вернитесь на главную и выберите раздел ещё раз.");
}

          <div class="stat">${objectionLibrary.stats.answers} вариантов ответа</div></div>
